<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Systems Exam Portal (Zero Duplicates & Even Distribution)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #0f172a;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-200 antialiased bg-slate-900">

    <div id="app"></div>

    <script>
        // ==========================================
        // DATA GENERATION ENGINE (ครอบคลุม 8 บท & ไม่ซ้ำกันเลย)
        // ==========================================
        
        const chapters = [
            "ระบบตัวเลข", "รหัสไบนารี่", "คณิตศาสตร์ลอจิก", "ลอจิกเกต", 
            "วงจรคอมบิเนชั่น", "วงจรฟลิปฟลอป", "วงจรนับ", "วงจรเลื่อนข้อมูล"
        ];

        // Pools เก็บข้อสอบแยกตาม 8 บท (บทละ MCQ=15, Fill=5, Essay=5)
        const poolMCQ = Array.from({length: 8}, () => []);
        const poolFill = Array.from({length: 8}, () => []);
        const poolEssay = Array.from({length: 8}, () => []);

        function createMCQ(chapIdx, qText, correct, w1, w2, w3) {
            let opts = [correct, w1, w2, w3];
            let shuffled = opts.map(a => ({val: a, sort: Math.random()})).sort((a, b) => a.sort - b.sort).map(a => a.val);
            poolMCQ[chapIdx].push({ type: 'mcq', chapter: chapters[chapIdx], question: qText, options: shuffled, correctAnswer: shuffled.indexOf(correct), explanation: "อ้างอิงเนื้อหาบท: " + chapters[chapIdx] });
        }

        function createFill(chapIdx, qText, ans) {
            poolFill[chapIdx].push({ type: 'fill', chapter: chapters[chapIdx], question: qText, correctAnswer: ans, explanation: "คีย์เวิร์ด: " + ans });
        }

        function createEssay(chapIdx, qText, ans) {
            poolEssay[chapIdx].push({ type: 'essay', chapter: chapters[chapIdx], question: qText, correctAnswer: ans, explanation: "แนวทางประเมิน: " + ans });
        }

        // --- 1. สร้างฐานข้อมูล MCQ (บทละ 15 ข้อ รวม 120 ข้อ) ---
        // Ch 0: ระบบตัวเลข
        for(let i=10; i<18; i++) createMCQ(0, `เลขฐานสิบ ${i} แปลงเป็นเลขฐานสองตรงกับข้อใด?`, i.toString(2), (i+1).toString(2), (i-1).toString(2), (i+2).toString(2));
        for(let i=18; i<25; i++) createMCQ(0, `เลขฐานสอง ${i.toString(2)} ตรงกับเลขฐานสิบใด?`, i.toString(), (i+1).toString(), (i-1).toString(), (i+3).toString());
        // Ch 1: รหัสไบนารี่
        for(let i=40; i<50; i++) {
            let bcd = parseInt(i.toString()[0]).toString(2).padStart(4,'0') + " " + parseInt(i.toString()[1]).toString(2).padStart(4,'0');
            createMCQ(1, `รหัส BCD-8421 ของ ${i} คือข้อใด?`, bcd, i.toString(2).padStart(8,'0'), (i+1).toString(2).padStart(8,'0'), bcd.replace('0','1'));
        }
        for(let i=2; i<7; i++) createMCQ(1, `รหัส Excess-3 ของเลข ${i} คือข้อใด?`, (i+3).toString(2).padStart(4,'0'), i.toString(2).padStart(4,'0'), (i+2).toString(2).padStart(4,'0'), (i+4).toString(2).padStart(4,'0'));
        // Ch 2: คณิตศาสตร์ลอจิก
        for(let i=5; i<13; i++) createMCQ(2, `1's Complement ของ ${i.toString(2).padStart(4,'0')} คือข้อใด?`, i.toString(2).padStart(4,'0').replace(/0/g,'x').replace(/1/g,'0').replace(/x/g,'1'), (i+1).toString(2).padStart(4,'0'), i.toString(2).padStart(4,'1'), "0000");
        for(let i=1; i<8; i++) createMCQ(2, `2's Complement ของ ${i.toString(2).padStart(4,'0')} คือข้อใด?`, (16-i).toString(2).padStart(4,'0'), (15-i).toString(2).padStart(4,'0'), i.toString(2).padStart(4,'0'), "1111");
        // Ch 3: ลอจิกเกต
        const ch3Data = [
            ["AND", "1 เมื่ออินพุตทุกตัวเป็น 1", "0 เมื่ออินพุตเหมือนกัน", "1 เมื่ออินพุตตัวใดตัวหนึ่งเป็น 1", "สลับค่าอินพุต"],
            ["OR", "1 เมื่อมีอินพุตใดเป็น 1", "1 เมื่ออินพุตต่างกัน", "0 เมื่ออินพุตทุกตัวเป็น 1 เท่านั้น", "สลับค่าอินพุต"],
            ["XOR", "1 เมื่ออินพุตต่างกัน", "1 เมื่ออินพุตเหมือนกัน", "0 เมื่ออินพุตต่างกัน", "1 ตลอดเวลา"],
            ["NAND", "0 เมื่ออินพุตทุกตัวเป็น 1", "1 เมื่ออินพุตทุกตัวเป็น 1", "0 เมื่ออินพุตเป็น 0", "1 เมื่ออินพุตเหมือนกัน"],
            ["NOR", "1 เมื่ออินพุตทุกตัวเป็น 0", "0 เมื่ออินพุตทุกตัวเป็น 0", "1 เมื่อมีอินพุตใดเป็น 1", "1 เมื่ออินพุตต่างกัน"],
            ["NOT", "สลับค่าลอจิกเป็นตรงกันข้าม", "คูณสัญญาณเข้าด้วยกัน", "บวกสัญญาณเข้าด้วยกัน", "หารความถี่สัญญาณ"]
        ];
        for(let i=0; i<15; i++) { let d = ch3Data[i%ch3Data.length]; createMCQ(3, `${d[0]} Gate มีลักษณะการให้เอาต์พุตอย่างไร? (คำถามจำลอง ${i})`, d[1], d[2], d[3], d[4]); }
        // Ch 4: วงจรคอมบิเนชั่น
        const ch4Data = [
            ["Multiplexer", "เลือกข้อมูลหลายช่องออกช่องเดียว", "กระจาย 1 ช่องออกหลายช่อง", "เข้ารหัสสัญญาณ", "นับสัญญาณคล็อก"],
            ["Decoder", "แปลงรหัสเข้าเป็นสายเดี่ยวที่ถูกเลือก", "เข้ารหัสสายเดี่ยวเป็นกลุ่มบิต", "บวกเลข", "เก็บข้อมูลชั่วคราว"],
            ["Encoder", "บีบอัด/เข้ารหัสสัญญาณ Active ให้เป็นบิตเลขฐานสอง", "ขยายสัญญาณบิตเป็นหลายสาย", "เลือกช่องสัญญาณ", "กรองความถี่"],
            ["วงจรคอมบิเนชั่น", "ไม่มีการป้อนกลับและไม่มีหน่วยความจำ", "มีหน่วยความจำ", "ขึ้นอยู่กับสถานะก่อนหน้า", "ต้องใช้สัญญาณนาฬิกาเสมอ"],
            ["LED 7-segment", "Common Anode ต้องป้อนลอจิก 0 เพื่อให้หลอดติด", "Common Cathode ต้องป้อน 0 เพื่อให้หลอดติด", "ต้องป้อนคล็อกตลอดเวลา", "มี 8 segment เสมอ"]
        ];
        for(let i=0; i<15; i++) { let d = ch4Data[i%ch4Data.length]; createMCQ(4, `คุณสมบัติของ ${d[0]} คือข้อใด? (คำถามจำลอง ${i})`, d[1], d[2], d[3], d[4]); }
        // Ch 5: วงจรฟลิปฟลอป
        const ch5Data = [
            ["ฟลิปฟลอปพื้นฐาน", "เป็นวงจรหน่วยความจำ 1 บิต", "เป็นวงจรประมวลผล 8 บิต", "ทำงานเฉพาะตอนไม่มีไฟ", "ใช้ลดรูปวงจร"],
            ["JK Flip-Flop", "แก้ปัญหาของ SR Flip-Flop เมื่ออินพุตเป็น 1,1", "ใช้สายเข้าเพียงเส้นเดียว", "นับเลขได้ในตัว", "ไม่มีสภาวะ Toggle"],
            ["T Flip-Flop", "สลับสถานะ (Toggle) เมื่อ T=1", "ส่งผ่านข้อมูล D ไป Q", "ไม่ใช้สัญญาณนาฬิกา", "เซ็ตค่าเป็น 0 เสมอ"],
            ["Master-Slave", "แก้ปัญหา Race-Around Condition", "เพิ่มแรงดันตกคร่อม", "สร้างดีเลย์ให้สัญญาณช้าลง", "ใช้ในการแปลงรหัส BCD"],
            ["Edge-Triggered", "ทำงานเฉพาะตอนขอบสัญญาณนาฬิกา (ขึ้นหรือลง)", "ทำงานตลอดเวลาที่คล็อกเป็น 1", "ไม่ต้องการคล็อก", "ทำงานเฉพาะคล็อกเป็น 0"]
        ];
        for(let i=0; i<15; i++) { let d = ch5Data[i%ch5Data.length]; createMCQ(5, `ข้อใดกล่าวถึง ${d[0]} ได้ถูกต้อง? (จำลอง ${i})`, d[1], d[2], d[3], d[4]); }
        // Ch 6: วงจรนับ
        for(let i=4; i<19; i++) {
            let ff = Math.ceil(Math.log2(i));
            createMCQ(6, `วงจรนับ Mod-${i} ต้องใช้ Flip-Flop อย่างน้อยกี่ตัว?`, `${ff} ตัว`, `${ff-1} ตัว`, `${ff+1} ตัว`, `${ff+2} ตัว`);
        }
        // Ch 7: วงจรเลื่อนข้อมูล
        for(let i=3; i<18; i++) {
            createMCQ(7, `Johnson Counter ที่ต่อ Flip-Flop ${i} ตัว จะมีสภาวะ (States) รวมกี่สถานะ?`, `${i*2} สถานะ`, `${i} สถานะ`, `${Math.pow(2,i)} สถานะ`, `${i+1} สถานะ`);
        }

        // --- 2. สร้างฐานข้อมูล Fill-in (บทละ 5 ข้อ รวม 40 ข้อ) ---
        const fillTemplates = [
            // Ch 0
            ["สัญญาณ ... มีสถานะไม่ต่อเนื่องและทนต่อสัญญาณรบกวนได้ดี", "ดิจิทัล"], ["บิตที่มีนัยสำคัญสูงสุด (ซ้ายสุด) เรียกว่า ...", "MSB"], ["บิตที่มีนัยสำคัญต่ำสุด (ขวาสุด) เรียกว่า ...", "LSB"], ["เลขฐาน ... ประกอบด้วยตัวเลข 0-9 และตัวอักษร A-F", "สิบหก"], ["สัญลักษณ์ 1010 ในฐานสอง มีค่าเท่ากับ ... ในฐานสิบ", "10"],
            // Ch 1
            ["รหัส ... Code เปลี่ยนค่าทีละ 1 บิตในลำดับติดกัน", "Gray"], ["รหัส ASCII มาตรฐานใช้บิตจำนวน ... บิต", "7"], ["รหัส BCD ย่อมาจาก Binary Coded ...", "Decimal"], ["รหัส ...-3 เกิดจากการนำค่ารหัส BCD มาบวกค่า 3", "Excess"], ["รหัส BCD-8421 สำหรับเลข 9 คือ ...", "1001"],
            // Ch 2
            ["การหา ...'s Complement คือการกลับสถานะ 0 เป็น 1 และ 1 เป็น 0", "1"], ["การหา ...'s Complement คือการนำค่าที่กลับสถานะแล้วมาบวก 1", "2"], ["สภาวะ ... เกิดขึ้นเมื่อบวกเลขฐานสองแล้วผลลัพธ์เกินขอบเขตบิตที่กำหนด", "Overflow"], ["บิตซ้ายสุดของเลขแบบ 2's Complement ทำหน้าที่เป็นบิตบอก ...", "เครื่องหมาย"], ["... Look-Ahead Adder เป็นวงจรบวกที่แก้ปัญหาความหน่วงเวลาของตัวทด", "Carry"],
            // Ch 3
            ["ตัวแปรแบบ ...-State คือตัวแปรที่มีได้เพียง 2 สถานะ", "Bi"], ["... Gate เปรียบเสมือนการนำอินพุตมาคูณกัน", "AND"], ["... Gate เปรียบเสมือนการนำอินพุตมาบวกกัน", "OR"], ["... Gate ทำหน้าที่อินเวิร์ต (Invert) หรือกลับสถานะลอจิก", "NOT"], ["NAND และ NOR ถูกเรียกว่าเป็น ... Gate เพราะสามารถสร้างวงจรเกตอื่นได้ทุกชนิด", "Universal"],
            // Ch 4
            ["วงจร ... มีหน้าที่เลือกข้อมูลหลายอินพุตให้ออกเพียง 1 เอาต์พุต", "MUX"], ["วงจร ... มีหน้าที่แปลงรหัสเลขฐานสองเป็นสายสัญญาณเดี่ยว", "Decoder"], ["LED แบบ 7-... นิยมใช้แสดงตัวเลขอารบิก 0-9", "Segment"], ["การต่อ LED หลายหลักโดยแชร์สายสัญญาณและสแกนการทำงาน เรียกว่า ...", "Multiplex"], ["วงจรคอมบิเนชั่นแตกต่างจากวงจรลำดับตรงที่ไม่มีส่วนของ ...", "หน่วยความจำ"],
            // Ch 5
            ["ฟลิปฟลอปพื้นฐานขนาด 1 ตัว ใช้จำข้อมูลได้ ... บิต", "1"], ["ใน JK Flip-Flop สภาวะที่ J=1 และ K=1 จะทำให้เกิดการ ... (สลับสถานะ)", "Toggle"], ["ปัญหา ...-Around เกิดใน JK Flip-Flop เมื่อความกว้างคล็อกนานเกินไป", "Race"], ["การแก้ปัญหาความกว้างพัลส์ในฟลิปฟลอป มักใช้วงจรแบบ ...-Slave", "Master"], ["ตาราง ... Table ใช้หาว่าต้องป้อนอินพุตลอจิกอะไรเมื่อต้องการเปลี่ยนสภาวะเอาต์พุต", "Excitation"],
            // Ch 6
            ["วงจรนับแบบ ... Counter สัญญาณนาฬิกาจะเข้าที่ฟลิปฟลอปตัวแรกเท่านั้น ตัวถัดไปรับคล็อกต่อๆ กัน", "Ripple (Asynchronous)"], ["วงจรนับแบบ ... Counter สัญญาณนาฬิกาจะเข้าฟลิปฟลอปทุกตัวพร้อมกัน", "Synchronous"], ["วงจร Mod-... คือวงจรที่นับค่าได้ 10 สถานะ (0 ถึง 9)", "10"], ["ข้อเสียของวงจรนับแบบไม่เข้าจังหวะ (Ripple) คือจะเกิด Propagation ... สะสม", "Delay"], ["K-... เป็นแผนผังที่ใช้ลดรูปสมการลอจิกในการออกแบบวงจรนับ", "Map"],
            // Ch 7
            ["วงจรเลื่อนข้อมูลแบบ ... รับข้อมูลเข้าพร้อมกันและส่งออกพร้อมกันทั้งหมด", "PIPO"], ["วงจร ... Counter สร้างจากการดึงเอาต์พุต Q ตัวสุดท้ายมาเข้า D ตัวแรก", "Ring"], ["วงจร ... Counter สร้างจากการดึงเอาต์พุต Q' (Invert) ตัวสุดท้ายมาเข้า D ตัวแรก", "Johnson"], ["การ Shift ข้อมูลไปทาง ... 1 บิต มีค่าเท่ากับการคูณตัวเลขด้วย 2", "ซ้าย"], ["Shift Register ประกอบจากการนำอุปกรณ์ ... หลายๆ ตัวมาต่ออนุกรมกัน", "Flip-Flop"]
        ];
        fillTemplates.forEach((f, i) => createFill(Math.floor(i/5), f[0], f[1]));

        // --- 3. สร้างฐานข้อมูล Essay (บทละ 5 ข้อ รวม 40 ข้อ) ---
        const essayTemplates = [
            // Ch 0
            ["อธิบายความต่างของสัญญาณดิจิทัลและอนาล็อก", "ดิจิทัลมีค่าสถานะแยกชัดเจน (เช่น 0, 1) ส่วนอนาล็อกมีค่าต่อเนื่อง"], ["ทำไมคอมพิวเตอร์ถึงใช้เลขฐานสอง", "เพราะวงจรอิเล็กทรอนิกส์ออกแบบให้อ่านสถานะเปิด(1) ปิด(0) ได้ง่ายและเสถียรสุด"], ["จงบอกวิธีแปลงทศนิยมฐานสิบเป็นฐานสอง", "นำส่วนทศนิยมคูณ 2 ไปเรื่อยๆ แล้วเก็บค่าจำนวนเต็มที่ได้ในแต่ละรอบมาเรียง"], ["อธิบายคำว่า MSB และ LSB", "MSB คือบิตซ้ายสุดที่มีน้ำหนัก/ค่ามากที่สุด LSB คือบิตขวาสุดที่มีค่าน้อยสุด"], ["ระบบตัวเลขฐานสิบหกมีประโยชน์อย่างไร", "ใช้จัดกลุ่มเลขฐานสอง 4 บิตให้เป็น 1 ตัวอักษร ช่วยให้อ่านและจำง่ายขึ้นมาก"],
            // Ch 1
            ["ทำไม Gray Code ถึงเหมาะกับเซ็นเซอร์วัดตำแหน่ง", "เพราะรหัสแต่ละลำดับเปลี่ยนค่าบิตเพียงบิตเดียว ลดโอกาสอ่านค่าผิดเพี้ยน ณ รอยต่อ"], ["รหัส BCD-8421 คืออะไร", "การนำเลขฐานสิบมาแปลงเป็นฐานสองโดยแยกแปลงทีละหลัก (หลักละ 4 บิต) เสมอ"], ["ASCII Code ใช้ทำอะไร", "ใช้เข้ารหัสแทนตัวอักษรภาษาอังกฤษและสัญลักษณ์ต่างๆ เพื่อการสื่อสารระหว่างคอมพิวเตอร์"], ["อธิบายคำว่า รหัสไม่ถ่วงน้ำหนัก (Unweighted Code)", "เป็นรหัสที่แต่ละตำแหน่งบิตไม่ได้มีค่าคณิตศาสตร์ตายตัว (เช่น Excess-3, Gray Code)"], ["รหัส Excess-3 สร้างขึ้นมาอย่างไร", "สร้างโดยนำเลขฐานสิบไปบวก 3 ก่อน จากนั้นค่อยแปลงเป็นรหัสเลขฐานสอง 4 บิต"],
            // Ch 2

        essayTemplates.forEach((e, i) => createEssay(Math.floor(i/5), e[0], e[1]));

        // --- Shuffle แต่ละ Pool เพื่อความสุ่มก่อนจ่ายข้อสอบ ---
        poolMCQ.forEach(p => p.sort(() => Math.random() - 0.5));
        poolFill.forEach(p => p.sort(() => Math.random() - 0.5));
        poolEssay.forEach(p => p.sort(() => Math.random() - 0.5));

        // ==========================================
        // การประกอบร่าง 4 ชุด (กระจาย 8 บทเท่าๆ กันในทุกส่วน)
        // ==========================================
        // การแบ่งสรร (Allocations): 
        // - ช้อยส์ 30 ข้อ: ดึงจากบท 0-7 บทละ 4 ข้อ (บางบท 3 ข้อ) รวม 30 
        // - เติมคำ 10 ข้อ: ดึงจากบท 0-7 บทละ 1 ข้อ (บางบท 2 ข้อ) รวม 10
        // - วิธีทำ 10 ข้อ: ดึงจากบท 0-7 บทละ 1 ข้อ (บางบท 2 ข้อ) รวม 10
        
        const allocMCQ = [
            [4,4,4,4,3,4,3,4], // Set 1 (Sum: 30)
            [4,4,4,3,4,3,4,4], // Set 2 (Sum: 30)
            [4,4,3,4,4,4,4,3], // Set 3 (Sum: 30)

        ]; // รวมถูกดึง = 15 ข้อต่อบท (หมดเกลี้ยงพอดี)

        const allocFill = [
            [2,1,1,1,1,2,1,1], // Set 1 (Sum: 10)
            [1,2,1,1,1,1,2,1], // Set 2 (Sum: 10)
            [1,1,2,1,1,1,1,2], // Set 3 (Sum: 10)
            [1,1,1,2,2,1,1,1]  // Set 4 (Sum: 10)

        const allocEssay = [
            [1,1,2,1,1,1,2,1], // Set 1 (Sum: 10)
            [1,1,1,2,1,1,1,2], // Set 2 (Sum: 10)
            [2,1,1,1,2,1,1,1], // Set 3 (Sum: 10)
            [1,2,1,1,1,2,1,1]  // Set 4 (Sum: 10)
        ]; // รวมถูกดึง = 5 ข้อต่อบท (หมดเกลี้ยงพอดี)

        function getExamSet(setIndex, prefix) {
            let mcqs = [], fills = [], essays = [];
            
            // ดึงข้อสอบจาก 8 บทมาใส่ตามโควต้าของชุดนั้น
            for(let c=0; c<8; c++) {
                for(let k=0; k<allocMCQ[setIndex][c]; k++) mcqs.push(poolMCQ[c].pop());
                for(let k=0; k<allocFill[setIndex][c]; k++) fills.push(poolFill[c].pop());
                for(let k=0; k<allocEssay[setIndex][c]; k++) essays.push(poolEssay[c].pop());
            }

            // คละลำดับข้อภายในส่วนให้เนียนยิ่งขึ้น
            mcqs.sort(() => Math.random() - 0.5);
            fills.sort(() => Math.random() - 0.5);
            essays.sort(() => Math.random() - 0.5);

            // เซ็ต ID ใหม่แบบเรียง 1-50
            let finalSet = [];
            mcqs.forEach((q, i) => { q.id = `${prefix}-MCQ-${i+1}`; finalSet.push(q); });
            fills.forEach((q, i) => { q.id = `${prefix}-FILL-${i+1}`; finalSet.push(q); });
            essays.forEach((q, i) => { q.id = `${prefix}-ESSAY-${i+1}`; finalSet.push(q); });

            return finalSet;
        }

        // --- ประกาศออบเจกต์ชุดข้อสอบทั้ง 4 ---
        const examSets = {
            'SET_1': { title: 'ชุดที่ 1 (ระดับมาตรฐาน - A)', diffClass: 'text-emerald-400', borderClass: 'border-emerald-500/30', bgClass: 'bg-emerald-500/10', data: getExamSet(0, 'S1') },
            'SET_2': { title: 'ชุดที่ 2 (ระดับมาตรฐาน - B)', diffClass: 'text-emerald-400', borderClass: 'border-emerald-500/30', bgClass: 'bg-emerald-500/10', data: getExamSet(1, 'S2') },
            'SET_3': { title: 'ชุดที่ 3 (ระดับท้าทาย - C)', diffClass: 'text-purple-400', borderClass: 'border-purple-500/30', bgClass: 'bg-purple-500/10', data: getExamSet(2, 'H1') },
            'SET_4': { title: 'ชุดที่ 4 (ระดับท้าทาย - D)', diffClass: 'text-purple-400', borderClass: 'border-purple-500/30', bgClass: 'bg-purple-500/10', data: getExamSet(3, 'H2') }
        };

        // --- State Application ---
        let state = {
            stage: 'home',

            currentIdx: 0,
            answers: [],
            history: JSON.parse(localStorage.getItem('digitalExamHistory_V5')) || [],
            viewingHistoryItem: null
        };
        let submitConfirmState = false;

        function initAutoResume() {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V5'));
            if (savedProgress && savedProgress.stage === 'quiz') {
                state.stage = savedProgress.stage;
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
            } else if (savedProgress && savedProgress.stage === 'home') {
                state.stage = 'home';
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
            }
        }
        initAutoResume();

        function saveHistory() {
            localStorage.setItem('digitalExamHistory_V5', JSON.stringify(state.history));
        }

        function saveProgress() {
            if (state.currentSetId) {
                localStorage.setItem('digitalExamProgress_V5', JSON.stringify({
                    stage: state.stage,
                    currentSetId: state.currentSetId,
                    currentIdx: state.currentIdx,
                    answers: state.answers
                }));
            }
        }

        function render() {
            const app = document.getElementById('app');
            if (state.stage === 'home') app.innerHTML = getHomeHTML();
            else if (state.stage === 'quiz') app.innerHTML = getQuizHTML();
            else if (state.stage === 'results') app.innerHTML = getResultsHTML();
            lucide.createIcons();
        }

        window.startExam = (setId) => {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V5'));
            if (savedProgress && savedProgress.currentSetId === setId && savedProgress.answers.some(a => a !== null && a !== '')) {
                if(!confirm("คุณมีข้อสอบชุดนี้ที่ทำค้างไว้ ต้องการเริ่มทำใหม่ทั้งหมดหรือไม่?\n(กด Cancel เพื่อทำต่อจากจุดเดิม)")) {
                    window.resumeExam();
                    return;
                }
            }
            state.stage = 'quiz';
            state.currentSetId = setId;
            state.currentIdx = 0;
            state.answers = Array(50).fill(null);
            submitConfirmState = false;
            saveProgress(); 
            window.scrollTo(0, 0);
            render();
        };

        window.resumeExam = () => {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V5'));
            if (savedProgress) {
                state.stage = 'quiz';
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
                submitConfirmState = false;
                saveProgress();
                window.scrollTo(0, 0);
                render();
            }
        }

        window.jumpToQuestion = (idx) => {
            state.currentIdx = idx;
            submitConfirmState = false;
            saveProgress();
            render();
        };

        window.selectOption = (optionIndex) => {
            state.answers[state.currentIdx] = optionIndex;
            saveProgress();
            render();
        };

        window.handleInputAnswer = (val) => {
            state.answers[state.currentIdx] = val;
            saveProgress(); 
        };

        window.handleInputBlur = () => {
            render();
        };

        window.nextQuestion = () => {
            if (state.currentIdx < 49) {
                state.currentIdx++;
                submitConfirmState = false;
                saveProgress();
                render();
            }
        };

        window.prevQuestion = () => {
            if (state.currentIdx > 0) {
                state.currentIdx--;
                submitConfirmState = false;
                saveProgress();
                render();
            }
        };

        window.submitExam = () => {
            if (!submitConfirmState) {
                submitConfirmState = true;
                render();
                setTimeout(() => { 
                    if(submitConfirmState) { submitConfirmState = false; render(); }
                }, 4000);
                return;
            }
            
            submitConfirmState = false;
            const analysis = calculateAnalysis(state.answers, examSets[state.currentSetId].data);
            
            const historyRecord = {
                id: Date.now(),
                setId: state.currentSetId,
                setName: examSets[state.currentSetId].title,
                date: new Date().toLocaleString('th-TH'),
                score: analysis.mcqScore,
                totalMCQ: 30,
                answers: [...state.answers],
                analysisData: analysis
            };
            
            state.history.unshift(historyRecord);
            saveHistory();
            localStorage.removeItem('digitalExamProgress_V5');

            state.viewingHistoryItem = historyRecord;
            state.stage = 'results';
            window.scrollTo(0, 0);
            render();
        };

        window.goHome = () => {
            state.stage = 'home';
            state.viewingHistoryItem = null;
            submitConfirmState = false;
            if (state.currentSetId) saveProgress(); 
            window.scrollTo(0, 0);
            render();
        };

        window.viewHistoryDetail = (historyId) => {
            const record = state.history.find(h => h.id === historyId);
            if (record) {
                state.viewingHistoryItem = record;
                state.stage = 'results';
                window.scrollTo(0, 0);
                render();
            }
        };

        window.clearHistoryDirect = () => {
            if(confirm("ลบประวัติการสอบที่ตรวจแล้วทั้งหมดใช่หรือไม่?")) {
                state.history = [];
                saveHistory();
                render();
            }
        }

        function calculateAnalysis(userAnswers, questionsData) {
            let mcqScore = 0;
            const chapters = {};

            userAnswers.forEach((ans, idx) => {
                const q = questionsData[idx];
                if (q.type === 'mcq') {
                    if (!chapters[q.chapter]) {
                        chapters[q.chapter] = { total: 0, correct: 0 };
                    }
                    chapters[q.chapter].total += 1;
                    if (ans === q.correctAnswer) {
                        mcqScore += 1;
                        chapters[q.chapter].correct += 1;
                    }
                }
            });

            const needReview = [];
            const good = [];

            Object.entries(chapters).forEach(([chapter, stats]) => {
                const percentage = stats.correct / stats.total;
                if (percentage < 0.7) {
                    needReview.push({ chapter, ...stats });
                } else {
                    good.push({ chapter, ...stats });
                }
            });

            return { mcqScore, needReview, good };
        }

        // --- Views ---
        function getHomeHTML() {
            let historyHTML = '';

        function getResultsHTML() {
            const record = state.viewingHistoryItem;
            const questionsData = examSets[record.setId].data;
            const analysis = record.analysisData;
            
            const isPass = analysis.mcqScore >= 15;
            const message = isPass ? '🎉 ยินดีด้วย! คุณผ่านเกณฑ์ส่วนของช้อยส์' : '📚 ส่วนตัวเลือกยังไม่ผ่านเกณฑ์ ทบทวนเพิ่มนะครับ';
            const colorTheme = isPass ? 'indigo' : 'red';

            let needReviewHTML = analysis.needReview.length > 0 
                ? '<ul class="space-y-3">' + analysis.needReview.map(item => `
                    <li class="text-sm bg-slate-800 p-3 rounded-lg border border-red-500/20 text-red-300 flex justify-between items-center">

                        <span class="font-mono text-xs bg-red-500/20 px-2 py-1 rounded">ถูก ${item.correct}/${item.total}</span>
                    </li>`).join('') + '</ul>'
                : '<p class="text-sm text-green-400 italic">ยอดเยี่ยม! คุณตอบถูกในส่วนเลือกตอบทั้งหมด</p>';

            let goodHTML = analysis.good.length > 0
                ? '<ul class="space-y-3">' + analysis.good.map(item => `

            let detailsHTML = '';
            questionsData.forEach((q, idx) => {

                let isSkipped, isCorrect, borderClass, iconHTML, userAnswerText, answerLabel;

                if (q.type === 'mcq') {
                    isSkipped = userAns === null;
                    isCorrect = userAns === q.correctAnswer;
                    borderClass = isCorrect ? 'border-green-500/30 bg-green-500/10' : (isSkipped ? 'border-amber-500/30 bg-amber-500/10' : 'border-red-500/30 bg-red-500/10');
                    iconHTML = isCorrect ? '<i data-lucide="check-circle-2" class="w-6 h-6 text-green-400 shrink-0"></i>' : (isSkipped ? '<i data-lucide="minus-circle" class="w-6 h-6 text-amber-400 shrink-0"></i>' : '<i data-lucide="x-circle" class="w-6 h-6 text-red-400 shrink-0"></i>');
                    userAnswerText = isSkipped ? '<span class="text-amber-500 font-medium">ไม่ได้ตอบ</span>' : `<span class="${isCorrect ? 'text-green-400' : 'text-red-400'} line-through">${q.options[userAns]}</span>`;
                    answerLabel = q.options[q.correctAnswer];

                    borderClass = isSkipped ? 'border-amber-500/30 bg-amber-500/10' : 'border-indigo-500/30 bg-indigo-500/10';

                        <div class="absolute top-0 left-0 w-full h-2 bg-${colorTheme}-500"></div>
                        <h2 class="text-3xl font-bold mb-1 text-white">ผลการทดสอบ</h2>
                        <p class="text-slate-400 mb-6">${record.setName} • ส่งเมื่อ ${record.date}</p>
                        
                        <div class="inline-flex flex-col items-center justify-center w-40 h-40 rounded-full border-8 border-${colorTheme}-500/20 mb-3 relative shadow-inner">
                            <span class="text-5xl font-black text-${colorTheme}-400">${analysis.mcqScore}</span>
                            <span class="text-lg text-slate-500 font-medium border-t border-slate-700 w-16 pt-1 mt-1">30</span>
                        </div>
                        <p class="text-xl font-bold text-slate-300 mb-2">${message}</p>
                        <p class="text-sm text-indigo-400 bg-indigo-500/10 py-1.5 px-4 rounded-full inline-block border border-indigo-500/20">
                            * ส่วนอัตนัย (เติมคำ/วิธีทำ) อีก 20 ข้อ รอผู้สอนตรวจให้คะแนน
                        </p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-red-500/10 rounded-2xl p-6 border border-red-500/20">
                            <div class="flex items-center mb-4 pb-4 border-b border-red-500/20">
                                <i data-lucide="target" class="w-6 h-6 text-red-400 mr-2"></i>
                                <h3 class="text-lg font-bold text-red-400">จุดที่ต้องเน้นทบทวน (จากช้อยส์)</h3>
                            </div>
                            ${needReviewHTML}
                        </div>

                        <div class="bg-green-500/10 rounded-2xl p-6 border border-green-500/20">
                            <div class="flex items-center mb-4 pb-4 border-b border-green-500/20">
                                <i data-lucide="award" class="w-6 h-6 text-green-400 mr-2"></i>
                                <h3 class="text-lg font-bold text-green-400">จุดที่ทำได้ดีเยี่ยม</h3>
                            </div>
                            ${goodHTML}
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 md:p-8 mt-8 shadow-lg">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700">
                            <h3 class="text-xl font-bold text-white flex items-center">
                                <i data-lucide="file-check-2" class="w-6 h-6 text-indigo-400 mr-2"></i>
                                เฉลยและแนวคำตอบทั้งหมด 50 ข้อ
                            </h3>
                        </div>
                        <div class="space-y-4">
                            ${detailsHTML}
                        </div>
                    </div>

                </div>
            </div>
            `;
        }

        // --- Start App ---
        render();

    </script>
