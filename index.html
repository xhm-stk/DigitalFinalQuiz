            "จำนวนสถานะของ Ring Counter และ Johnson Counter (สมมติมี N บิต)|Ring Counter จะหมุนวนนับได้ N สถานะ ส่วน Johnson Counter จะเกิดสถานะบิดเกลียวรวมกันได้ 2N สถานะ",
            "ความสัมพันธ์ของการ Shift ข้อมูลกับการคำนวณทางคณิตศาสตร์ฐานสอง|การ Shift บิตไปทางซ้าย 1 ตำแหน่ง (เติม 0 ท้าย) มีค่าเท่ากับการคูณด้วย 2 ส่วนการ Shift ไปทางขวา 1 ตำแหน่ง เท่ากับการหารด้วย 2",
            "เปรียบเทียบความเร็วในการโหลดข้อมูลของ PIPO กับ SISO Shift Register|PIPO (Parallel) สามารถโหลดข้อมูลทุกบิตเสร็จใน Clock เดียว ส่วน SISO (Serial) ต้องใช้เวลานานเท่ากับจำนวนบิต N Clock จึงจะเสร็จสิ้น"
        ];

        // --- Data Parser Engine (สร้าง Array Object จาก String) ---
        const poolMCQ = Array.from({length: 8}, () => []);
        const poolFill = Array.from({length: 8}, () => []);
        const poolEssay = Array.from({length: 8}, () => []);

        rawMCQ.forEach((str, idx) => {
            let [q, a, w1, w2, w3] = str.split('|');
            let chapIdx = Math.floor(idx / 15);
            let opts = [a, w1, w2, w3];
            let shuffled = opts.map(x => ({val: x, sort: Math.random()})).sort((x, y) => x.sort - y.sort).map(x => x.val);
            poolMCQ[chapIdx].push({
                type: 'mcq', chapter: chapters[chapIdx], question: q, options: shuffled, correctAnswer: shuffled.indexOf(a), explanation: `อ้างอิงเนื้อหาบท: ${chapters[chapIdx]} (จุดเน้นข้อควรระวัง)`
            });
        });

        rawFill.forEach((str, idx) => {
            let [q, a] = str.split('|');
            let chapIdx = Math.floor(idx / 5);
            poolFill[chapIdx].push({ type: 'fill', chapter: chapters[chapIdx], question: `[เติมคำ] ${q}`, correctAnswer: a, explanation: "คีย์เวิร์ดสำคัญ: " + a });
        });

        rawEssay.forEach((str, idx) => {
            let [q, a] = str.split('|');
            let chapIdx = Math.floor(idx / 5);
            poolEssay[chapIdx].push({ type: 'essay', chapter: chapters[chapIdx], question: `[แสดงวิธีทำ/อธิบาย] ${q}`, correctAnswer: a, explanation: "แนวทางวิเคราะห์: " + a });
        });

        // --- Shuffle Pool ก่อนจัดสรรเข้าชุด ---
        poolMCQ.forEach(p => p.sort(() => Math.random() - 0.5));
        poolFill.forEach(p => p.sort(() => Math.random() - 0.5));
        poolEssay.forEach(p => p.sort(() => Math.random() - 0.5));

        // ==========================================
        // การประกอบร่าง 4 ชุด (กระจาย 8 บทเท่าๆ กัน)
        // ==========================================
        const allocMCQ = [
            [4,4,4,4,3,4,3,4], // Set 1
            [4,4,4,3,4,3,4,4], // Set 2
            [4,4,3,4,4,4,4,3], // Set 3
            [3,3,4,4,4,4,4,4]  // Set 4
        ];
        const allocFill = [
            [2,1,1,1,1,2,1,1], // Set 1
            [1,2,1,1,1,1,2,1], // Set 2
            [1,1,2,1,1,1,1,2], // Set 3
            [1,1,1,2,2,1,1,1]  // Set 4
        ];
        const allocEssay = [
            [1,1,2,1,1,1,2,1], // Set 1
            [1,1,1,2,1,1,1,2], // Set 2
            [2,1,1,1,2,1,1,1], // Set 3
            [1,2,1,1,1,2,1,1]  // Set 4
        ];

        function getExamSet(setIndex, prefix) {
            let mcqs = [], fills = [], essays = [];
            
            // ดึงข้อสอบเรียงจากบท 0 -> 7 ทำให้เวลาทำข้อสอบจะพบว่า "เนื้อหาเรียงลำดับบท" อย่างเป็นธรรมชาติ
            for(let c=0; c<8; c++) {
                let tMCQ = [];
                for(let k=0; k<allocMCQ[setIndex][c]; k++) tMCQ.push(poolMCQ[c].pop());
                tMCQ.sort(() => Math.random() - 0.5); // คละเฉพาะภายในบทเดียวกัน
                mcqs.push(...tMCQ);

                let tFill = [];
                for(let k=0; k<allocFill[setIndex][c]; k++) tFill.push(poolFill[c].pop());
                tFill.sort(() => Math.random() - 0.5);
                fills.push(...tFill);

                let tEssay = [];
                for(let k=0; k<allocEssay[setIndex][c]; k++) tEssay.push(poolEssay[c].pop());
                tEssay.sort(() => Math.random() - 0.5);
                essays.push(...tEssay);
            }

            let finalSet = [];
            mcqs.forEach((q, i) => { q.id = `${prefix}-MCQ-${i+1}`; finalSet.push(q); });
            fills.forEach((q, i) => { q.id = `${prefix}-FILL-${i+1}`; finalSet.push(q); });
            essays.forEach((q, i) => { q.id = `${prefix}-ESSAY-${i+1}`; finalSet.push(q); });

            return finalSet;
        }

        const examSets = {
            'SET_1': { title: 'ชุดที่ 1 (เรียงเนื้อหา)', diffClass: 'text-sky-400', borderClass: 'border-sky-500/30', bgClass: 'bg-sky-500/10', data: getExamSet(0, 'A') },
            'SET_2': { title: 'ชุดที่ 2 (เรียงเนื้อหา)', diffClass: 'text-sky-400', borderClass: 'border-sky-500/30', bgClass: 'bg-sky-500/10', data: getExamSet(1, 'B') },
            'SET_3': { title: 'ชุดที่ 3 (เรียงเนื้อหา)', diffClass: 'text-rose-400', borderClass: 'border-rose-500/30', bgClass: 'bg-rose-500/10', data: getExamSet(2, 'C') },
            'SET_4': { title: 'ชุดที่ 4 (เรียงเนื้อหา)', diffClass: 'text-rose-400', borderClass: 'border-rose-500/30', bgClass: 'bg-rose-500/10', data: getExamSet(3, 'D') }
        };

        // --- State Application ---
        let state = {
            stage: 'home',
            currentSetId: null,
            currentIdx: 0,
            answers: [],
            history: JSON.parse(localStorage.getItem('digitalExamHistory_V6')) || [],
            viewingHistoryItem: null
        };
        let submitConfirmState = false;

        function initAutoResume() {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V6'));
            if (savedProgress && savedProgress.stage === 'quiz') {
                state.stage = savedProgress.stage;
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
            } else if (savedProgress && savedProgress.stage === 'home') {
                state.stage = 'home';
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
            }
        }
        initAutoResume();

        function saveHistory() {
            localStorage.setItem('digitalExamHistory_V6', JSON.stringify(state.history));
        }

        function saveProgress() {
            if (state.currentSetId) {
                localStorage.setItem('digitalExamProgress_V6', JSON.stringify({
                    stage: state.stage,
                    currentSetId: state.currentSetId,
                    currentIdx: state.currentIdx,
                    answers: state.answers
                }));
            }
        }

        function render() {
            const app = document.getElementById('app');
            if (state.stage === 'home') app.innerHTML = getHomeHTML();
            else if (state.stage === 'quiz') app.innerHTML = getQuizHTML();
            else if (state.stage === 'results') app.innerHTML = getResultsHTML();
            lucide.createIcons();
        }

        window.startExam = (setId) => {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V6'));
            if (savedProgress && savedProgress.currentSetId === setId && savedProgress.answers.some(a => a !== null && a !== '')) {
                if(!confirm("คุณมีข้อสอบชุดนี้ที่ทำค้างไว้ ต้องการเริ่มทำใหม่ทั้งหมดหรือไม่?\n(กด Cancel เพื่อทำต่อจากจุดเดิม)")) {
                    window.resumeExam();
                    return;
                }
            }
            state.stage = 'quiz';
            state.currentSetId = setId;
            state.currentIdx = 0;
            state.answers = Array(50).fill(null);
            submitConfirmState = false;
            saveProgress(); 
            window.scrollTo(0, 0);
            render();
        };

        window.resumeExam = () => {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V6'));
            if (savedProgress) {
                state.stage = 'quiz';
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
                submitConfirmState = false;
                saveProgress();
                window.scrollTo(0, 0);
                render();
            }
        }

        window.jumpToQuestion = (idx) => {
            state.currentIdx = idx;
            submitConfirmState = false;
            saveProgress();
            render();
        };

        window.selectOption = (optionIndex) => {
            state.answers[state.currentIdx] = optionIndex;
            saveProgress();
            render();
        };

        window.handleInputAnswer = (val) => {
            state.answers[state.currentIdx] = val;
            saveProgress(); 
        };

        window.handleInputBlur = () => {
            render();
        };

        window.nextQuestion = () => {
            if (state.currentIdx < 49) {
                state.currentIdx++;
                submitConfirmState = false;
                saveProgress();
                render();
            }
        };

        window.prevQuestion = () => {
            if (state.currentIdx > 0) {
                state.currentIdx--;
                submitConfirmState = false;
                saveProgress();
                render();
            }
        };

        window.submitExam = () => {
            if (!submitConfirmState) {
                submitConfirmState = true;
                render();
                setTimeout(() => { 
                    if(submitConfirmState) { submitConfirmState = false; render(); }
                }, 4000);
                return;
            }
            
            submitConfirmState = false;
            const analysis = calculateAnalysis(state.answers, examSets[state.currentSetId].data);
            
            const historyRecord = {
                id: Date.now(),
                setId: state.currentSetId,
                setName: examSets[state.currentSetId].title,
                date: new Date().toLocaleString('th-TH'),
                score: analysis.mcqScore,
                totalMCQ: 30,
                answers: [...state.answers],
                analysisData: analysis
            };
            
            state.history.unshift(historyRecord);
            saveHistory();
            localStorage.removeItem('digitalExamProgress_V6');

            state.viewingHistoryItem = historyRecord;
            state.stage = 'results';
            window.scrollTo(0, 0);
            render();
        };

        window.goHome = () => {
            state.stage = 'home';
            state.viewingHistoryItem = null;
            submitConfirmState = false;
            if (state.currentSetId) saveProgress(); 
            window.scrollTo(0, 0);
            render();
        };

        window.viewHistoryDetail = (historyId) => {
            const record = state.history.find(h => h.id === historyId);
            if (record) {
                state.viewingHistoryItem = record;
                state.stage = 'results';
                window.scrollTo(0, 0);
                render();
            }
        };

        window.clearHistoryDirect = () => {
            if(confirm("ลบประวัติการสอบที่ตรวจแล้วทั้งหมดใช่หรือไม่?")) {
                state.history = [];
                saveHistory();
                render();
            }
        }

        function calculateAnalysis(userAnswers, questionsData) {
            let mcqScore = 0;
            const chapters = {};

            userAnswers.forEach((ans, idx) => {
                const q = questionsData[idx];
                if (q.type === 'mcq') {
                    if (!chapters[q.chapter]) {
                        chapters[q.chapter] = { total: 0, correct: 0 };
                    }
                    chapters[q.chapter].total += 1;
                    if (ans === q.correctAnswer) {
                        mcqScore += 1;
                        chapters[q.chapter].correct += 1;
                    }
                }
            });

            const needReview = [];
            const good = [];

            Object.entries(chapters).forEach(([chapter, stats]) => {
                const percentage = stats.correct / stats.total;
                if (percentage < 0.7) {
                    needReview.push({ chapter, ...stats });
                } else {
                    good.push({ chapter, ...stats });
                }
            });

            return { mcqScore, needReview, good };
        }

        // --- Views ---
        function getHomeHTML() {
            let historyHTML = '';
            if (state.history.length === 0) {
                historyHTML = `
                    <div class="text-center py-12 bg-slate-800/50 rounded-2xl border border-slate-700 border-dashed">
                        <i data-lucide="history" class="w-12 h-12 text-slate-600 mx-auto mb-3"></i>
                        <p class="text-slate-400">ยังไม่มีประวัติการทำข้อสอบ</p>
                    </div>`;
            } else {
                historyHTML = '<div class="space-y-4">';
                state.history.forEach(h => {
                    const passClass = h.score >= 15 
                        ? 'text-green-400 bg-green-500/10 border-green-500/30' 
                        : 'text-red-400 bg-red-500/10 border-red-500/30';
                    historyHTML += `
                        <div class="flex items-center justify-between p-4 bg-slate-800 rounded-xl border border-slate-700 shadow-sm hover:bg-slate-750 transition-colors">
                            <div>
                                <h4 class="font-semibold text-white">${h.setName}</h4>
                                <div class="flex items-center text-sm text-slate-400 mt-1">
                                    <i data-lucide="calendar" class="w-4 h-4 mr-1"></i> ${h.date}
                                </div>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="${passClass} px-4 py-2 rounded-lg border font-bold text-center min-w-[80px]">
                                    <div class="text-lg">${h.score} / 30</div>
                                    <div class="text-[10px] opacity-70 mt-[-2px]">ส่วน MCQ</div>
                                </div>
                                <button onclick="viewHistoryDetail(${h.id})" class="p-2 text-indigo-400 hover:bg-indigo-500/20 rounded-lg transition-colors" title="ดูรายละเอียด">
                                    <i data-lucide="chevron-right" class="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                historyHTML += '</div>';
            }

            let savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V6'));

            return `
            <div class="min-h-screen pb-12">
                <div class="bg-indigo-950/80 border-b border-indigo-900/50 pt-16 pb-16 px-6 rounded-b-[3rem] shadow-xl">
                    <div class="max-w-4xl mx-auto text-center">
                        <i data-lucide="brain-circuit" class="w-16 h-16 mx-auto mb-4 text-indigo-400"></i>
                        <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight text-white">Digital Systems Exam Portal</h1>
                        <div class="text-indigo-200/80 text-lg max-w-3xl mx-auto bg-slate-900/40 p-4 rounded-2xl border border-indigo-500/20 inline-block text-left mt-2 shadow-inner">
                            <p class="font-bold text-white mb-2 text-center text-base"><i data-lucide="award" class="w-5 h-5 inline mr-1 text-yellow-400"></i> โครงสร้างข้อสอบ (เน้นจุดที่พลาดง่าย + เรียงลำดับเนื้อหา)</p>
                            <ul class="space-y-1 text-sm md:text-base text-slate-300">
                                <li><i data-lucide="check-circle" class="w-4 h-4 inline text-indigo-400 mr-2"></i> ส่วนที่ 1: เลือกตอบ (MCQ) 30 ข้อ</li>
                                <li><i data-lucide="edit-2" class="w-4 h-4 inline text-indigo-400 mr-2"></i> ส่วนที่ 2: เติมคำ 10 ข้อ</li>
                                <li><i data-lucide="align-left" class="w-4 h-4 inline text-indigo-400 mr-2"></i> ส่วนที่ 3: แสดงวิธีทำ 10 ข้อ</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <div class="max-w-4xl mx-auto px-4 mt-8 space-y-12">
                    <section>
                        <div class="flex items-center mb-6">
                            <i data-lucide="play-circle" class="w-6 h-6 text-indigo-400 mr-2"></i>
                            <h2 class="text-2xl font-bold text-white">เลือกชุดข้อสอบ (ทั้งหมด 4 ชุด)</h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${Object.keys(examSets).map(key => {
                                const set = examSets[key];
                                const isResumable = savedProgress && savedProgress.currentSetId === key;
                                
                                let actionButtons = '';
                                if (isResumable) {
                                    actionButtons = `
                                        <button onclick="resumeExam()" class="w-full py-3 bg-amber-500/20 text-amber-400 font-bold rounded-xl hover:bg-amber-600 hover:text-white transition-colors border border-amber-500/40 shadow-lg shadow-amber-500/10">
                                            <i data-lucide="play" class="w-4 h-4 inline mr-1"></i> ทำข้อสอบต่อ (Resume)
                                        </button>
                                        <button onclick="startExam('${key}')" class="w-full mt-3 py-2 text-sm text-slate-400 hover:text-white transition-colors border border-slate-700 rounded-xl hover:bg-slate-800">
                                            <i data-lucide="rotate-ccw" class="w-4 h-4 inline mr-1 -mt-0.5"></i> เริ่มทำใหม่ทั้งหมด
                                        </button>
                                    `;
                                } else {
                                    actionButtons = `
                                        <button onclick="startExam('${key}')" class="w-full py-3 bg-indigo-500/10 text-indigo-400 font-semibold rounded-xl hover:bg-indigo-600 hover:text-white transition-colors border border-indigo-500/20 shadow-md">
                                            เริ่มทำข้อสอบ
                                        </button>
                                    `;
                                }

                                return `
                                <div class="bg-slate-800 rounded-2xl p-6 border ${isResumable ? 'border-amber-500/30 ring-1 ring-amber-500/20' : 'border-slate-700 hover:border-indigo-500'} hover:shadow-lg hover:shadow-indigo-500/10 transition-all relative">
                                    ${isResumable ? '<span class="absolute -top-3 right-4 bg-amber-500 text-slate-900 text-xs font-bold px-3 py-1 rounded-full shadow-md animate-pulse">กำลังทำค้างไว้</span>' : ''}
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="w-12 h-12 ${set.bgClass} ${set.diffClass} rounded-full flex items-center justify-center font-bold text-xl border ${set.borderClass}">
                                            ${key.split('_')[1]}
                                        </div>
                                        <div class="text-xs font-medium px-3 py-1 rounded-full ${set.bgClass} ${set.diffClass} border ${set.borderClass}">
                                            <i data-lucide="sort-asc" class="w-3 h-3 inline mr-1"></i> เรียงเนื้อหาบท 1-8
                                        </div>
                                    </div>
                                    <h3 class="text-xl font-bold text-white mb-2">${set.title}</h3>
                                    <p class="text-slate-400 mb-6 flex items-center text-sm"><i data-lucide="alert-triangle" class="w-4 h-4 mr-2 text-yellow-500/70"></i> เน้นทฤษฎีและจุดวิเคราะห์ที่พลาดง่าย</p>
                                    ${actionButtons}
                                </div>
                                `
                            }).join('')}
                        </div>
                    </section>

                    <section>
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center">
                                <i data-lucide="history" class="w-6 h-6 text-indigo-400 mr-2"></i>
                                <h2 class="text-2xl font-bold text-white">ประวัติการสอบของคุณ</h2>
                            </div>
                            ${state.history.length > 0 ? `
                                <button onclick="clearHistoryDirect()" class="text-sm text-red-400 hover:text-red-300 flex items-center px-3 py-1 rounded-lg hover:bg-red-500/10 transition-colors">
                                    <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i> ล้างประวัติ
                                </button>
                            ` : ''}
                        </div>
                        ${historyHTML}
                    </section>
                </div>
            </div>
            `;
        }

        function getQuizHTML() {
            const currentData = examSets[state.currentSetId];
            const q = currentData.data[state.currentIdx];
            
            let answeredCount = 0;
            state.answers.forEach((ans, i) => {
                const type = currentData.data[i].type;
                if (type === 'mcq' && ans !== null) answeredCount++;
                if ((type === 'fill' || type === 'essay') && ans && ans.trim() !== '') answeredCount++;
            });
            const progressPercent = (answeredCount / 50) * 100;

            let inputSectionHTML = '';

            if (q.type === 'mcq') {
                let optionsHTML = '';
                q.options.forEach((opt, i) => {
                    const isSelected = state.answers[state.currentIdx] === i;
                    const btnClass = isSelected 
                        ? 'border-indigo-500 bg-indigo-500/20 text-indigo-100 ring-1 ring-indigo-500' 
                        : 'border-slate-700 bg-slate-800/50 hover:border-indigo-400 hover:bg-slate-700 text-slate-300';
                    const circleClass = isSelected ? 'border-indigo-500 bg-indigo-500' : 'border-slate-600 bg-slate-800';
                    
                    optionsHTML += `
                        <button onclick="selectOption(${i})" class="w-full text-left p-4 rounded-xl border transition-all duration-200 flex items-center ${btnClass}">
                            <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-4 shrink-0 transition-colors ${circleClass}">
                                ${isSelected ? '<div class="w-2 h-2 rounded-full bg-white"></div>' : ''}
                            </div>
                            <span class="text-md leading-relaxed">${opt}</span>
                        </button>
                    `;
                });
                inputSectionHTML = `<div class="space-y-3 mt-auto">${optionsHTML}</div>`;
            } 
            else if (q.type === 'fill') {
                let val = state.answers[state.currentIdx] || '';
                inputSectionHTML = `
                    <div class="mt-auto pt-8">
                        <p class="text-sm font-semibold text-indigo-400 mb-3"><i data-lucide="edit-2" class="w-4 h-4 inline mr-1"></i> ส่วนที่ 2: เติมคำตอบสั้นๆ (กรุณาพิมพ์ลงในช่องด้านล่าง)</p>
                        <input type="text" value="${val}" oninput="handleInputAnswer(this.value)" onblur="handleInputBlur()"
                            class="w-full bg-slate-800 border border-slate-600 rounded-xl p-4 text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all outline-none shadow-inner"
                            placeholder="พิมพ์คำตอบของคุณที่นี่... (ระบบบันทึกอัตโนมัติ)">
                    </div>
                `;
            } 
            else if (q.type === 'essay') {
                let val = state.answers[state.currentIdx] || '';
                inputSectionHTML = `
                    <div class="mt-auto pt-8 flex-grow flex flex-col">
                        <p class="text-sm font-semibold text-indigo-400 mb-3"><i data-lucide="align-left" class="w-4 h-4 inline mr-1"></i> ส่วนที่ 3: แสดงวิธีทำ / อธิบายรายละเอียด</p>
                        <textarea oninput="handleInputAnswer(this.value)" onblur="handleInputBlur()"
                            class="w-full flex-grow bg-slate-800 border border-slate-600 rounded-xl p-4 text-white focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all outline-none resize-none min-h-[200px] shadow-inner"
                            placeholder="พิมพ์อธิบายวิธีทำหรือแนวคำตอบของคุณอย่างละเอียด... (ระบบบันทึกอัตโนมัติ)">${val}</textarea>
                    </div>
                `;
            }

            let navigatorHTML = '';
            for (let i = 0; i < 50; i++) {
                const type = currentData.data[i].type;
                let isDone = false;
                if (type === 'mcq') isDone = state.answers[i] !== null;
                else isDone = state.answers[i] && state.answers[i].trim() !== '';

                const isCurrent = state.currentIdx === i;
                let btnStyle = 'bg-slate-800 border-slate-700 text-slate-500 hover:bg-slate-700';
                if (isCurrent) btnStyle = 'ring-2 ring-indigo-500 bg-indigo-500/20 border-indigo-500 text-indigo-200 font-bold';
                else if (isDone) btnStyle = 'bg-indigo-600 border-indigo-600 text-white shadow-sm';

                navigatorHTML += `
                    <button onclick="jumpToQuestion(${i})" class="w-10 h-10 flex items-center justify-center rounded-lg border text-sm transition-all ${btnStyle}">
                        ${i + 1}
                    </button>
                `;
            }

            const submitBtnText = submitConfirmState ? 'คลิกอีกครั้งเพื่อยืนยันส่ง' : 'ส่งคำตอบทั้งหมด';
            const submitBtnClass = submitConfirmState ? 'bg-red-600 hover:bg-red-500 border-red-500 shadow-red-500/30' : 'bg-green-600 hover:bg-green-500 border-green-500 shadow-green-500/30';

            return `
            <div class="min-h-screen flex flex-col md:flex-row">
                
                <div class="flex-grow flex flex-col py-6 px-4 md:px-8 max-w-4xl w-full mx-auto">
                    <div class="mb-6 flex items-center justify-between bg-slate-800 p-4 rounded-2xl border border-slate-700 chapter-badge">
                        <div>
                            <span class="text-sm font-bold text-indigo-300 tracking-wider bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full">${currentData.title}</span>
                            <h2 class="text-sm font-semibold text-white mt-3 ml-1 flex items-center"><i data-lucide="book" class="w-4 h-4 mr-2 text-indigo-400"></i> หมวดเนื้อหา: <span class="text-indigo-300 ml-2 bg-indigo-900/50 px-2 py-0.5 rounded">${q.chapter}</span></h2>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-semibold text-slate-300">ทำแล้ว ${answeredCount}/50 ข้อ</span>
                            <div class="bg-slate-700 rounded-full h-2 w-32 mt-2 overflow-hidden shadow-inner">
                                <div class="bg-amber-500 h-2 rounded-full transition-all duration-300 shadow-[0_0_8px_rgba(245,158,11,0.6)]" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 md:p-10 flex-grow flex flex-col shadow-lg shadow-black/20 relative">
                        <div class="absolute top-4 right-6 text-xs text-slate-500 flex items-center">
                            <i data-lucide="cloud-lightning" class="w-3 h-3 mr-1 text-green-500"></i> บันทึกอัตโนมัติ
                        </div>
                        <div class="flex items-start mb-6 mt-4 md:mt-0">
                            <span class="text-4xl font-black text-slate-700 mr-4 mt-1 leading-none">${state.currentIdx + 1}.</span>
                            <h3 class="text-xl md:text-2xl font-medium leading-relaxed text-white">${q.question}</h3>
                        </div>
                        ${inputSectionHTML}
                    </div>

                    <div class="mt-6 flex justify-between items-center">
                        <button onclick="prevQuestion()" class="px-6 py-3 rounded-xl font-medium flex items-center transition-colors ${state.currentIdx === 0 ? 'invisible' : 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700'}">
                            <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> ก่อนหน้า
                        </button>
                        
                        ${state.currentIdx === 49 ? `
                            <button onclick="submitExam()" class="px-6 md:px-8 py-3 text-white rounded-xl font-bold transition-all flex items-center border shadow-lg ${submitBtnClass}">
                                <i data-lucide="${submitConfirmState ? 'alert-triangle' : 'check-circle'}" class="w-5 h-5 mr-2"></i> ${submitBtnText}
                            </button>
                        ` : `
                            <button onclick="nextQuestion()" class="px-6 py-3 rounded-xl font-medium flex items-center transition-colors bg-indigo-600 text-white hover:bg-indigo-500">
                                ถัดไป <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                            </button>
                        `}
                    </div>
                </div>

                <div class="w-full md:w-80 bg-slate-800 border-l border-slate-700 p-6 hidden md:block overflow-y-auto">
                    <div class="sticky top-0 bg-slate-800 pb-4 z-10 border-b border-slate-700 mb-4 flex justify-between items-center">
                        <h3 class="font-bold text-white">แผงนำทางข้อสอบ</h3>
                        <button onclick="goHome()" class="text-sm text-slate-400 hover:text-red-400 transition-colors">ออก</button>
                    </div>
                    
                    <p class="text-xs text-slate-500 mb-2">ส่วนที่ 1: เลือกตอบ (ข้อ 1-30)</p>
                    <div class="grid grid-cols-5 gap-2 mb-4">
                        ${navigatorHTML.match(/<button[\s\S]*?<\/button>/g).slice(0, 30).join('')}
                    </div>

                    <p class="text-xs text-slate-500 mb-2">ส่วนที่ 2: เติมคำ (ข้อ 31-40)</p>
                    <div class="grid grid-cols-5 gap-2 mb-4">
                        ${navigatorHTML.match(/<button[\s\S]*?<\/button>/g).slice(30, 40).join('')}
                    </div>

                    <p class="text-xs text-slate-500 mb-2">ส่วนที่ 3: วิธีทำ (ข้อ 41-50)</p>
                    <div class="grid grid-cols-5 gap-2">
                        ${navigatorHTML.match(/<button[\s\S]*?<\/button>/g).slice(40, 50).join('')}
                    </div>

                    <div class="mt-8 pt-4 border-t border-slate-700">
                        <div class="flex items-center text-xs text-slate-400 mb-2">
                            <div class="w-3 h-3 bg-slate-800 border border-slate-600 rounded mr-2"></div> ยังไม่ได้ทำ
                        </div>
                        <div class="flex items-center text-xs text-slate-400 mb-2">
                            <div class="w-3 h-3 bg-indigo-600 rounded mr-2"></div> ทำแล้ว
                        </div>
                        <div class="flex items-center text-xs text-slate-400">
                            <div class="w-3 h-3 bg-indigo-500/20 border-2 border-indigo-500 rounded mr-2"></div> ข้อปัจจุบัน
                        </div>
                    </div>
                </div>

                <div class="md:hidden bg-slate-800 border-t border-slate-700 p-4 sticky bottom-0 z-20">
                    <div class="flex overflow-x-auto gap-2 no-scrollbar pb-2">
                        ${navigatorHTML}
                    </div>
                </div>

            </div>
            `;
        }

        function getResultsHTML() {
            const record = state.viewingHistoryItem;
            const questionsData = examSets[record.setId].data;
            const analysis = record.analysisData;
            
            const isPass = analysis.mcqScore >= 15;
            const message = isPass ? '🎉 ยินดีด้วย! คุณผ่านเกณฑ์ส่วนของช้อยส์' : '📚 ส่วนตัวเลือกยังไม่ผ่านเกณฑ์ ทบทวนเพิ่มนะครับ';
            const colorTheme = isPass ? 'indigo' : 'red';

            let needReviewHTML = analysis.needReview.length > 0 
                ? '<ul class="space-y-3">' + analysis.needReview.map(item => `
                    <li class="text-sm bg-slate-800 p-3 rounded-lg border border-red-500/20 text-red-300 flex justify-between items-center">
                        <span>${item.chapter}</span>
                        <span class="font-mono text-xs bg-red-500/20 px-2 py-1 rounded">ถูก ${item.correct}/${item.total}</span>
                    </li>`).join('') + '</ul>'
                : '<p class="text-sm text-green-400 italic">ยอดเยี่ยม! คุณตอบถูกในส่วนเลือกตอบทั้งหมด</p>';

            let goodHTML = analysis.good.length > 0
                ? '<ul class="space-y-3">' + analysis.good.map(item => `
                    <li class="text-sm bg-slate-800 p-3 rounded-lg border border-green-500/20 text-green-300 flex justify-between items-center">
                        <span>${item.chapter}</span>
                        <span class="font-mono text-xs bg-green-500/20 px-2 py-1 rounded">ถูก ${item.correct}/${item.total}</span>
                    </li>`).join('') + '</ul>'
                : '<p class="text-sm text-slate-500 italic">-</p>';

            let detailsHTML = '';
            questionsData.forEach((q, idx) => {
                const userAns = record.answers[idx];
                let isSkipped, isCorrect, borderClass, iconHTML, userAnswerText, answerLabel;

                if (q.type === 'mcq') {
                    isSkipped = userAns === null;
                    isCorrect = userAns === q.correctAnswer;
                    borderClass = isCorrect ? 'border-green-500/30 bg-green-500/10' : (isSkipped ? 'border-amber-500/30 bg-amber-500/10' : 'border-red-500/30 bg-red-500/10');
                    iconHTML = isCorrect ? '<i data-lucide="check-circle-2" class="w-6 h-6 text-green-400 shrink-0"></i>' : (isSkipped ? '<i data-lucide="minus-circle" class="w-6 h-6 text-amber-400 shrink-0"></i>' : '<i data-lucide="x-circle" class="w-6 h-6 text-red-400 shrink-0"></i>');
                    userAnswerText = isSkipped ? '<span class="text-amber-500 font-medium">ไม่ได้ตอบ</span>' : `<span class="${isCorrect ? 'text-green-400' : 'text-red-400'} line-through">${q.options[userAns]}</span>`;
                    answerLabel = q.options[q.correctAnswer];
                } else {
                    isSkipped = !userAns || userAns.trim() === '';
                    isCorrect = false; 
                    borderClass = isSkipped ? 'border-amber-500/30 bg-amber-500/10' : 'border-indigo-500/30 bg-indigo-500/10';
                    iconHTML = isSkipped ? '<i data-lucide="minus-circle" class="w-6 h-6 text-amber-400 shrink-0"></i>' : '<i data-lucide="clock" class="w-6 h-6 text-indigo-400 shrink-0"></i>';
                    userAnswerText = isSkipped ? '<span class="text-amber-500 font-medium">ไม่ได้ตอบ</span>' : `<span class="text-indigo-300 break-words whitespace-pre-wrap">"${userAns}"</span>`;
                    answerLabel = q.correctAnswer;
                }

                const waitReviewBadge = (q.type !== 'mcq' && !isSkipped) ? '<span class="text-xs ml-2 bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30 font-medium">รอผู้สอนตรวจ</span>' : '';

                detailsHTML += `
                    <div class="p-5 rounded-xl border ${borderClass}">
                        <div class="flex items-start gap-3">
                            ${iconHTML}
                            <div class="flex-grow w-full overflow-hidden">
                                <h4 class="font-medium text-slate-200 leading-snug">ข้อ ${idx + 1}. <span class="text-slate-400 text-xs ml-2 bg-slate-700 px-2 py-1 rounded">หมวด: ${q.chapter}</span><br/>${q.question}</h4>
                                <div class="mt-3 space-y-2 text-sm">
                                    <div class="text-slate-400">คำตอบของคุณ: ${userAnswerText} ${waitReviewBadge}</div>
                                    <p class="text-green-400 font-medium">${q.type === 'mcq' ? 'เฉลย:' : 'แนวคำตอบ:'} ${answerLabel}</p>
                                    <div class="mt-3 p-3 bg-slate-900/50 rounded-lg border border-slate-700 text-slate-400 text-sm">
                                        <i data-lucide="info" class="w-4 h-4 inline-block mr-1 -mt-0.5 opacity-50"></i>
                                        ${q.explanation}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            return `
            <div class="min-h-screen py-10 px-4">
                <div class="max-w-4xl mx-auto space-y-6">
                    
                    <button onclick="goHome()" class="flex items-center text-slate-400 hover:text-indigo-400 transition-colors mb-6 font-medium">
                        <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> กลับหน้าหลัก
                    </button>

                    <div class="bg-slate-800 rounded-3xl border border-slate-700 p-8 text-center relative overflow-hidden shadow-lg">
                        <div class="absolute top-0 left-0 w-full h-2 bg-${colorTheme}-500"></div>
                        <h2 class="text-3xl font-bold mb-1 text-white">ผลการทดสอบ</h2>
                        <p class="text-slate-400 mb-6">${record.setName} • ส่งเมื่อ ${record.date}</p>
                        
                        <div class="inline-flex flex-col items-center justify-center w-40 h-40 rounded-full border-8 border-${colorTheme}-500/20 mb-3 relative shadow-inner">
                            <span class="text-5xl font-black text-${colorTheme}-400">${analysis.mcqScore}</span>
                            <span class="text-lg text-slate-500 font-medium border-t border-slate-700 w-16 pt-1 mt-1">30</span>
                        </div>
                        <p class="text-xl font-bold text-slate-300 mb-2">${message}</p>
                        <p class="text-sm text-indigo-400 bg-indigo-500/10 py-1.5 px-4 rounded-full inline-block border border-indigo-500/20">
                            * ส่วนอัตนัย (เติมคำ/วิธีทำ) อีก 20 ข้อ รอผู้สอนตรวจให้คะแนน
                        </p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-red-500/10 rounded-2xl p-6 border border-red-500/20">
                            <div class="flex items-center mb-4 pb-4 border-b border-red-500/20">
                                <i data-lucide="target" class="w-6 h-6 text-red-400 mr-2"></i>
                                <h3 class="text-lg font-bold text-red-400">จุดที่ต้องเน้นทบทวน (จากช้อยส์)</h3>
                            </div>
                            ${needReviewHTML}
                        </div>

                        <div class="bg-green-500/10 rounded-2xl p-6 border border-green-500/20">
                            <div class="flex items-center mb-4 pb-4 border-b border-green-500/20">
                                <i data-lucide="award" class="w-6 h-6 text-green-400 mr-2"></i>
                                <h3 class="text-lg font-bold text-green-400">จุดที่ทำได้ดีเยี่ยม</h3>
                            </div>
                            ${goodHTML}
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 md:p-8 mt-8 shadow-lg">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700">
                            <h3 class="text-xl font-bold text-white flex items-center">
                                <i data-lucide="file-check-2" class="w-6 h-6 text-indigo-400 mr-2"></i>
                                เฉลยและแนวคำตอบทั้งหมด 50 ข้อ
                            </h3>
                        </div>
                        <div class="space-y-4">
                            ${detailsHTML}
                        </div>
                    </div>

                </div>
            </div>
            `;
        }

        // --- Start App ---
        render();

    </script>
</body>
</html>
