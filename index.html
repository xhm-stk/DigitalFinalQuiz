    <script>
        // --- ส่วนที่ 1: ข้อมูลฐานคำถามแบบเลือกตอบ (MCQ) ---
        const baseQuestions = [
            { chapter: "ระบบตัวเลข", question: "สัญญาณดิจิทัลมีกี่สถานะ?", options: ["1 สถานะ", "2 สถานะ", "3 สถานะ", "ไม่จำกัด"], correctAnswer: 1, explanation: "สัญญาณดิจิทัลมี 2 สถานะ คือ 0 (Low) และ 1 (High)" },
            { chapter: "รหัสไบนารี่ (Week 11)", question: "รหัส BCD-8421 ของเลข 7 คือข้อใด?", options: ["0110", "1000", "0111", "1001"], correctAnswer: 2, explanation: "เลข 7 ในระบบฐานสิบ แปลงเป็นเลขฐานสองแบบ BCD-8421 ใช้ 4 บิต คือ 0111" },
            { chapter: "รหัสไบนารี่ (Week 11)", question: "เลขฐานสิบ 47 เมื่อแปลงเป็น BCD-8421 ได้ผลลัพธ์คือข้อใด?", options: ["0100 0111", "0100 1000", "101111", "0111 0100"], correctAnswer: 0, explanation: "4 แปลงเป็น 0100 และ 7 แปลงเป็น 0111 นำมาต่อกัน" },
            { chapter: "รหัสไบนารี่ (Week 11)", question: "รหัส Excess-3 ของเลข 5 คือข้อใด?", options: ["0101", "1000", "0111", "1010"], correctAnswer: 1, explanation: "Excess-3 คือการนำเลขฐานสิบมาบวก 3 (5+3=8) แล้วแปลงเป็นฐานสอง 4 บิต (1000)" },
            { chapter: "คณิตศาสตร์ลอจิก (Week 11)", question: "การแปลงเลขทศนิยมฐานสิบ 0.625 เป็นเลขฐานสอง มีค่าตรงกับข้อใด?", options: ["0.101", "0.110", "0.011", "0.111"], correctAnswer: 0, explanation: "0.625 × 2 = 1.250 (1), 0.250 × 2 = 0.500 (0), 0.500 × 2 = 1.000 (1) -> 0.101" },
            { chapter: "ลอจิกเกต (Week 12)", question: "ตัวแปรลอจิก (Logic Variable) มีลักษณะตามข้อใด?", options: ["มีสถานะต่อเนื่อง", "อยู่พร้อมกันได้ 2 สถานะ", "มีได้เพียง 2 สถานะ และเป็นพร้อมกันไม่ได้", "มีค่าเป็น 1 เสมอ"], correctAnswer: 2, explanation: "เป็น Bi-State Variable (เปิด-ปิด, 0-1) เป็นพร้อมกันไม่ได้" },
            { chapter: "วงจรคอมบิเนชั่นฯ (Week 13)", question: "ข้อใดกล่าวถูกต้องเกี่ยวกับวงจรคอมบิเนชั่น?", options: ["มีหน่วยความจำ", "ขึ้นอยู่กับอินพุตปัจจุบันและสภาวะก่อนหน้า", "ต้องมี Clock", "เอาต์พุตขึ้นอยู่กับอินพุตปัจจุบันเท่านั้น"], correctAnswer: 3, explanation: "วงจรคอมบิเนชั่นไม่มีการป้อนกลับและไม่มีหน่วยความจำ" },
            { chapter: "วงจรคอมบิเนชั่นฯ (Week 13)", question: "การต่อ LED 7-segment แบบมัลติเพล็กซ์ มีลักษณะอย่างไร?", options: ["1 วงจรถอดรหัส ต่อ 1 หลัก", "ต่อขา a-g เข้าด้วยกัน ใช้ขา Common สลับการทำงาน", "ไม่ใช้ตัวต้านทาน", "ไฟติดพร้อมกันทั้งหมดเสมอ"], correctAnswer: 1, explanation: "แชร์พอร์ต a-g และใช้ขา Common กวาดสลับติดทีละหลักอย่างรวดเร็ว" },
            { chapter: "วงจรฟลิปฟลอป (Week 16)", question: "ฟลิปฟลอป ทำหน้าที่หลักอะไร?", options: ["แปลงอนาล็อกเป็นดิจิทัล", "กรองความถี่", "หน่วยความจำ 1 บิต", "เพิ่มแรงดัน"], correctAnswer: 2, explanation: "เป็นอุปกรณ์ Bistable ใช้เก็บสถานะ 0 หรือ 1 เสมือนหน่วยความจำ 1 บิต" },
            { chapter: "วงจรฟลิปฟลอป (Week 16)", question: "ใน JK Flip-Flop หาก J=1, K=1 เมื่อมี Clock เอาต์พุตจะเป็นอย่างไร?", options: ["เป็น 1 เสมอ", "เป็น 0 เสมอ", "คงค่าเดิม", "สลับสถานะจากเดิม (Toggle)"], correctAnswer: 3, explanation: "สภาวะ Toggle จะกลับสถานะจาก 0 เป็น 1 หรือ 1 เป็น 0" },
            { chapter: "วงจรนับ (Week 16)", question: "หลักการทำงานและการประยุกต์ใช้งานหลักของวงจรนับ (Counter Circuit) คือข้อใด?", options: ["เก็บข้อมูลทีละบิตแล้วเลื่อนออก เพื่อแปลงสัญญาณอนุกรมเป็นขนาน", "ทำงานประสานกันเพื่อนับจำนวนพัลส์ของสัญญาณนาฬิกา นิยมใช้สร้างนาฬิกาดิจิทัลและตัวแบ่งความถี่", "ประมวลผลอินพุตและส่งผลลัพธ์ออกทันทีโดยไม่มีการจดจำค่าเดิม", "เพิ่มระดับความแรงของสัญญาณดิจิทัลเพื่อส่งในระยะไกล"], correctAnswer: 1, explanation: "วงจรนับทำงานโดยการนับจำนวนสัญญาณพัลส์ (Pulse) หรือสัญญาณนาฬิกาที่เข้ามา จึงถูกนำไปประยุกต์ใช้ในการจับเวลา สร้างนาฬิกาดิจิทัล และเป็นวงจรแบ่งความถี่ (Frequency Divider)" },
            { chapter: "วงจรเลื่อนข้อมูล (Week 17)", question: "วงจรเลื่อนข้อมูลแบบ PIPO คืออะไร?", options: ["เข้าทีละบิต ออกทีละบิต", "เข้าทีละบิต ออกพร้อมกัน", "เข้าพร้อมกัน ออกทีละบิต", "เข้าพร้อมกัน ออกพร้อมกัน"], correctAnswer: 3, explanation: "PIPO = Parallel In - Parallel Out" },
            { chapter: "วงจร Sequential (Week 17)", question: "ความแตกต่างสำคัญที่ทำให้ วงจร Sequential ต่างจาก วงจร Combinational?", options: ["ทำงานแบบ Asynchronous", "เอาต์พุตขึ้นอยู่กับอินพุตปัจจุบันและเอาต์พุตเดิม", "ใช้แค่ Logic Gate พื้นฐาน", "เอาต์พุตเร็วกว่า"], correctAnswer: 1, explanation: "Sequential มีหน่วยความจำ (Feedback) บันทึกสภาวะก่อนหน้า" },
            { chapter: "วงจรนับ (Week 16)", question: "วงจรนับแบบใดที่สัญญาณนาฬิกาเข้าที่ฟลิปฟลอปตัวแรกเท่านั้น?", options: ["Synchronous Counter", "Asynchronous (Ripple) Counter", "Ring Counter", "Johnson Counter"], correctAnswer: 1, explanation: "Ripple Counter จะส่งผ่านสัญญาณนาฬิกาต่อๆ กันไป (ไม่ได้เข้าทุกตัวพร้อมกัน)" },
            { chapter: "รหัสต่าง ๆ (Week 11)", question: "ข้อใดเป็นคุณสมบัติเด่นของ Gray Code?", options: ["ใช้บิตน้อยที่สุด", "รหัสบิตถัดไปเปลี่ยนแปลงเพียงครั้งละ 1 บิต", "คำนวณทางคณิตศาสตร์ได้ง่าย", "เป็นรหัสที่มีการถ่วงน้ำหนัก"], correctAnswer: 1, explanation: "คุณสมบัติสำคัญของ Gray Code คือเมื่อค่าเปลี่ยน 1 สเตป บิตจะเปลี่ยนสถานะเพียงบิตเดียวเท่านั้น เพื่อลดข้อผิดพลาด" }
        ];

        // --- ส่วนที่ 2: ข้อมูลฐานคำถามเติมคำ (Fill-in-the-blank) ---
        const fillBaseQuestions = [
            { chapter: "วงจรคอมบิเนชั่นฯ", question: "วงจรคอมบิเนชั่นไม่มีการป้อนกลับสัญญาณ และไม่มี __________ เพื่อเก็บข้อมูลสภาวะก่อนหน้า", answer: "หน่วยความจำ" },
            { chapter: "วงจรฟลิปฟลอป", question: "ฟลิปฟลอปแบบ JK เมื่อมีการป้อนลอจิก J=1, K=1 จะเกิดสภาวะที่เรียกว่า __________", answer: "Toggle (สลับสถานะ)" },
            { chapter: "ลอจิกเกต", question: "ตัวแปรลอจิกมีลักษณะเป็น __________ Variable คือมีสภาวะได้เพียง 2 สถานะเท่านั้น", answer: "Bi-State" },
            { chapter: "รหัสไบนารี่", question: "รหัสที่มีการเปลี่ยนแปลงบิตเพียง 1 บิตในทุกๆ การเปลี่ยนลำดับค่าที่ติดกัน คือรหัส __________", answer: "Gray Code" },
            { chapter: "วงจร Sequential", question: "อุปกรณ์ที่ทำหน้าที่เป็นหน่วยความจำขนาด 1 บิต และเป็นพื้นฐานของวงจร Sequential ทั้งหมดคือ __________", answer: "Flip-Flop (ฟลิปฟลอป)" },
            { chapter: "วงจรเลื่อนข้อมูล", question: "วงจรเลื่อนข้อมูลแบบรับข้อมูลเข้าพร้อมกัน และออกพร้อมกันทั้งหมด มีชื่อย่อภาษาอังกฤษ 4 ตัวอักษรคือ __________", answer: "PIPO" },
            { chapter: "รหัสไบนารี่", question: "รหัสตัวเลข BCD ย่อมาจากคำเต็มว่า __________", answer: "Binary Coded Decimal" },
            { chapter: "วงจรนับ", question: "__________ คือวงจรตรรกะแบบลำดับที่ใช้ Flip-Flop ทำหน้าที่นับจำนวนสัญญาณพัลส์ (Pulse)", answer: "วงจรนับ (Counter)" },
            { chapter: "วงจรคอมบิเนชั่นฯ", question: "การนำ LED 7-segment มาต่อกันหลายหลัก โดยใช้ขา Common ร่วมกันและสลับกวาดการทำงานอย่างรวดเร็ว เรียกว่าหลักการ __________", answer: "มัลติเพล็กซ์ (Multiplex)" },
            { chapter: "รหัสต่าง ๆ", question: "รหัส ASCII แบบมาตรฐานเพื่อใช้เก็บตัวอักษรและสัญลักษณ์ มีขนาดข้อมูล __________ บิตต่อหนึ่งอักขระ", answer: "7" }
        ];

        // --- ส่วนที่ 3: ข้อมูลฐานคำถามวิธีทำ/อธิบาย (Essay) ---
        const essayBaseQuestions = [
            { chapter: "วงจร Sequential", question: "จงอธิบายความแตกต่างหลักระหว่าง วงจร Combinational และ วงจร Sequential มาพอสังเขป", answer: "วงจร Combinational เอาต์พุตขึ้นอยู่กับอินพุตปัจจุบันเท่านั้น ไม่มีหน่วยความจำ แต่วงจร Sequential เอาต์พุตจะขึ้นอยู่กับทั้งอินพุตปัจจุบันและสถานะก่อนหน้า (มีหน่วยความจำ/Feedback)" },
            { chapter: "วงจรเลื่อนข้อมูล", question: "ให้อธิบายหลักการทำงานและประโยชน์ของการนำ Shift Register (วงจรเลื่อนข้อมูล) ไปประยุกต์ใช้งาน", answer: "ใช้แปลงข้อมูลอนุกรมเป็นขนาน (SIPO) หรือข้อมูลขนานเป็นอนุกรม (PISO) สำหรับการสื่อสาร ใช้จัดเก็บข้อมูลชั่วคราว รวมถึงการทำวงจรหน่วงเวลา (Delay)" },
            { chapter: "วงจรนับ", question: "จงยกตัวอย่างการประยุกต์ใช้งานวงจรนับ (Counter Circuit) ในชีวิตประจำวันหรือในระบบดิจิทัล มาอย่างน้อย 2 ตัวอย่าง", answer: "1. นาฬิกาดิจิทัล/นาฬิกาจับเวลา สำหรับนับวินาที นาที 2. วงจรแบ่งความถี่ (Frequency Divider) ในไมโครคอนโทรลเลอร์" },
            { chapter: "วงจรฟลิปฟลอป", question: "จงอธิบายสภาวะการทำงานของ JK Flip-Flop เมื่อป้อนอินพุต (J=0, K=0) และ (J=1, K=1)", answer: "เมื่อ J=0, K=0 จะเกิดสภาวะ No Change (คงค่าเดิมไม่เปลี่ยนแปลง) และเมื่อ J=1, K=1 จะเกิดสภาวะ Toggle (สลับสถานะไปมาระหว่าง 0 กับ 1 เมื่อมีสัญญาณนาฬิกามากระตุ้น)" },
            { chapter: "รหัสต่าง ๆ", question: "อธิบายเหตุผลสำคัญที่ต้องนำรหัส Gray Code มาประยุกต์ใช้ในระบบดิจิทัล แทนการใช้รหัสฐานสองปกติ", answer: "เพราะ Gray Code มีการเปลี่ยนแปลงลอจิกเพียง 1 บิตเสมอในแต่ละลำดับค่าที่เปลี่ยนไป ทำให้สามารถลดปัญหา Glitch หรือการประมวลผลผิดพลาดในจังหวะรอยต่อของการเปลี่ยนข้อมูลได้ดี" },
            { chapter: "วงจรเลื่อนข้อมูล", question: "จงเปรียบเทียบข้อแตกต่างระหว่างวงจรเลื่อนข้อมูลแบบ SISO (Serial-In Serial-Out) และ PIPO (Parallel-In Parallel-Out)", answer: "SISO รับข้อมูลเข้าทีละบิตและส่งออกทีละบิต ต้องใช้สัญญาณนาฬิกาเท่าจำนวนบิต ทำให้ช้ากว่า PIPO ที่สามารถรับข้อมูลทุกบิตพร้อมกันและส่งออกได้ทันทีใน 1 สัญญาณนาฬิกา" },
            { chapter: "ระบบตัวเลข", question: "อธิบายขั้นตอนในการแปลงเลขทศนิยมฐานสิบ (ตัวอย่างเช่น 0.625) ให้กลายเป็นเลขฐานสอง", answer: "นำส่วนทศนิยมมาคูณด้วย 2 ไปเรื่อยๆ แล้วนำค่าจำนวนเต็มที่ได้จากผลคูณในแต่ละรอบ (0 หรือ 1) มาเรียงจากบนลงล่าง เขียนออกมาเป็นทศนิยมฐานสอง" },
            { chapter: "ระบบตัวเลข", question: "เหตุใดสัญญาณดิจิทัลจึงได้รับความนิยมและนำมาใช้ประมวลผลในคอมพิวเตอร์ปัจจุบันมากกว่าสัญญาณอนาล็อก?", answer: "เพราะสัญญาณดิจิทัลมีเพียง 2 สถานะ (0, 1) ทำให้มีความทนทานต่อสัญญาณรบกวน (Noise) ได้สูงกว่า จัดเก็บหรือคัดลอกได้โดยไม่เสียคุณภาพ และสร้างวงจรตรรกะสำหรับประมวลผลได้ง่ายกว่า" },
            { chapter: "วงจรคอมบิเนชั่นฯ", question: "การต่อใช้งาน LED 7-Segment แบบ Common Anode และ Common Cathode มีความแตกต่างกันอย่างไร?", answer: "แบบ Common Anode (แอโนดร่วม) ต้องป้อนลอจิก 0 (Low) ที่ขาสัญญาณเพื่อให้หลอด LED ติดสว่าง ส่วนแบบ Common Cathode (แคโทดร่วม) ต้องป้อนลอจิก 1 (High) เพื่อให้หลอด LED ติดสว่าง" },
            { chapter: "ลอจิกเกต", question: "จงอธิบายความหมายของคำว่า Bi-State Variable (ตัวแปรสองสถานะ) ในทฤษฎีลอจิก", answer: "คือตัวแปรที่สามารถมีสภาวะความเป็นไปได้เพียง 2 สถานะเท่านั้น เช่น 0 หรือ 1, เปิด หรือ ปิด, จริง หรือ เท็จ และมีข้อจำกัดคือไม่สามารถเป็นทั้งสองสถานะพร้อมกันในเวลาเดียวกันได้" }
        ];

        // --- สร้างชุดข้อสอบ 50 ข้อ แบ่ง 3 ส่วน ---
        function generateExamSet(setName, prefixId) {
            let exam = [];
            
            // ส่วนที่ 1: แบบเลือกตอบ (MCQ) - 30 ข้อ
            const shuffledBase = [...baseQuestions].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 30; i++) {
                const baseRef = shuffledBase[i % shuffledBase.length];
                exam.push({
                    id: `${prefixId}-MCQ-${i+1}`,
                    type: 'mcq',
                    chapter: baseRef.chapter,
                    question: `[ส่วนที่ 1: เลือกตอบ] ${baseRef.question}`,
                    options: baseRef.options,
                    correctAnswer: baseRef.correctAnswer,
                    explanation: baseRef.explanation
                });
            }

            // ส่วนที่ 2: เติมคำ (Fill-in-the-blank) - 10 ข้อ
            const shuffledFill = [...fillBaseQuestions].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 10; i++) {
                exam.push({
                    id: `${prefixId}-FILL-${i+1}`,
                    type: 'fill',
                    chapter: shuffledFill[i].chapter,
                    question: `[ส่วนที่ 2: เติมคำ] ข้อที่ ${i+1} ${shuffledFill[i].question}`,
                    correctAnswer: shuffledFill[i].answer,
                    explanation: "คีย์เวิร์ดสำคัญ: " + shuffledFill[i].answer
                });
            }

            // ส่วนที่ 3: แสดงวิธีทำ (Essay/Show Work) - 10 ข้อ
            const shuffledEssay = [...essayBaseQuestions].sort(() => Math.random() - 0.5);
            for (let i = 0; i < 10; i++) {
                exam.push({
                    id: `${prefixId}-ESSAY-${i+1}`,
                    type: 'essay',
                    chapter: shuffledEssay[i].chapter,
                    question: `[ส่วนที่ 3: แสดงวิธีทำ] ข้อที่ ${i+1} ${shuffledEssay[i].question}`,
                    correctAnswer: shuffledEssay[i].answer,
                    explanation: "การตรวจคำตอบส่วนนี้ ผู้สอนจะพิจารณาจากความเข้าใจและการอธิบายที่ถูกต้องตามหลักทฤษฎี"
                });
            }

            return exam;
        }

        // โหลดข้อมูล 5 ชุด
        const examSets = {
            'A': { title: 'ชุดที่ 1 (SET A)', data: generateExamSet('ชุดที่ 1 (SET A)', 'A') },
            'B': { title: 'ชุดที่ 2 (SET B)', data: generateExamSet('ชุดที่ 2 (SET B)', 'B') },

        // --- State ของแอปพลิเคชัน ---
        let state = {
            stage: 'home',

        // --- ระบบ Auto Save (Resume) เมื่อผู้ใช้กด Refresh หน้าจอ ---
        function initAutoResume() {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V2'));
            if (savedProgress && savedProgress.stage === 'quiz') {
                state.stage = savedProgress.stage;
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
            } else if (savedProgress && savedProgress.stage === 'home') {
                state.stage = 'home';
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
            }
        }
        initAutoResume();

        function saveHistory() {
            localStorage.setItem('digitalExamHistory_V2', JSON.stringify(state.history));
        }

        function saveProgress() {
            if (state.currentSetId) {
                localStorage.setItem('digitalExamProgress_V2', JSON.stringify({
                    stage: state.stage,
                    currentSetId: state.currentSetId,
                    currentIdx: state.currentIdx,
                    answers: state.answers
                }));
            }
        }

        function render() {
            const app = document.getElementById('app');
            
            if (state.stage === 'home') app.innerHTML = getHomeHTML();
            else if (state.stage === 'quiz') app.innerHTML = getQuizHTML();
            else if (state.stage === 'results') app.innerHTML = getResultsHTML();

        }

        // --- Controllers ---
        window.startExam = (setId) => {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V2'));
            // เช็คว่ามีข้อสอบทำค้างอยู่ชุดเดียวกับที่กำลังจะเริ่มใหม่หรือไม่
            if (savedProgress && savedProgress.currentSetId === setId && savedProgress.answers.some(a => a !== null && a !== '')) {
                if(!confirm("คุณมีข้อสอบชุดนี้ที่ทำค้างไว้ ต้องการเริ่มทำใหม่ทั้งหมดหรือไม่?\n(กด Cancel เพื่อทำต่อจากจุดเดิม)")) {
                    window.resumeExam();
                    return;
                }
            }

            state.stage = 'quiz';
            state.currentSetId = setId;
            state.currentIdx = 0;
            state.answers = Array(50).fill(null);
            submitConfirmState = false;

            window.scrollTo(0, 0);
            render();
        };

        window.resumeExam = () => {
            const savedProgress = JSON.parse(localStorage.getItem('digitalExamProgress_V2'));
            if (savedProgress) {
                state.stage = 'quiz';
                state.currentSetId = savedProgress.currentSetId;
                state.currentIdx = savedProgress.currentIdx;
                state.answers = savedProgress.answers;
                submitConfirmState = false;
                saveProgress();
                window.scrollTo(0, 0);
                render();
            }
        }

        window.jumpToQuestion = (idx) => {
            state.currentIdx = idx;
            submitConfirmState = false;

        };

        // สำหรับเลือกตอบ (MCQ)
        window.selectOption = (optionIndex) => {
            state.answers[state.currentIdx] = optionIndex;

        };

        // สำหรับรับค่าพิมพ์เติมคำและวิธีทำ
        window.handleInputAnswer = (val) => {
            state.answers[state.currentIdx] = val;
            saveProgress(); // บันทึกอัตโนมัติขณะพิมพ์
        };

        // เมื่อพิมพ์เสร็จแล้วเสียบโฟกัส ให้เรนเดอร์เพื่ออัปเดตสีแผงปุ่มด้านขวา
        window.handleInputBlur = () => {
            render();
        };

        window.nextQuestion = () => {
            if (state.currentIdx < 49) {
                state.currentIdx++;
                submitConfirmState = false;
                saveProgress();
                render();
            }
        };

        window.prevQuestion = () => {
            if (state.currentIdx > 0) {
                state.currentIdx--;
                submitConfirmState = false;
                saveProgress();
                render();
            }
        };

        // ระบบยืนยันการส่ง 2 ครั้ง
        window.submitExam = () => {
            if (!submitConfirmState) {
                submitConfirmState = true;
                render();
                // รีเซ็ตสถานะปุ่มกลับหากไม่กดยืนยันภายใน 4 วินาที
                setTimeout(() => { 
                    if(submitConfirmState) { submitConfirmState = false; render(); }
                }, 4000);
                return;
            }
            
            submitConfirmState = false;
            const analysis = calculateAnalysis(state.answers, examSets[state.currentSetId].data);
            
            const historyRecord = {
                id: Date.now(),
                setId: state.currentSetId,
                setName: examSets[state.currentSetId].title,
                date: new Date().toLocaleString('th-TH'),
                score: analysis.mcqScore,
                totalMCQ: 30,
                answers: [...state.answers],
                analysisData: analysis
            };
            
            state.history.unshift(historyRecord);
            saveHistory();

            // ล้าง Progress ที่ทำค้างไว้เพราะส่งคำตอบแล้ว
            localStorage.removeItem('digitalExamProgress_V2');

            window.scrollTo(0, 0);
            render();
        };

            render();
        };

                state.viewingHistoryItem = record;

                window.scrollTo(0, 0);
                render();
            }
        };

        window.clearHistoryDirect = () => {
            if(confirm("ลบประวัติการสอบที่ตรวจแล้วทั้งหมดใช่หรือไม่?")) {
                state.history = [];
                saveHistory();
                render();
            }
        }

        // --- วิเคราะห์ผล (คำนวณเฉพาะส่วนที่ 1 MCQ) ---
        function calculateAnalysis(userAnswers, questionsData) {
            let mcqScore = 0;
            const chapters = {};

            userAnswers.forEach((ans, idx) => {
                const q = questionsData[idx];
                
                if (q.type === 'mcq') {
                    if (!chapters[q.chapter]) {
                        chapters[q.chapter] = { total: 0, correct: 0 };
                    }
                    chapters[q.chapter].total += 1;
                    
                    if (ans === q.correctAnswer) {
                        mcqScore += 1;
                        chapters[q.chapter].correct += 1;
                    }
                }
            });

            const needReview = [];
            const good = [];

            Object.entries(chapters).forEach(([chapter, stats]) => {
                const percentage = stats.correct / stats.total;
                if (percentage < 0.7) {
                    needReview.push({ chapter, ...stats });
                } else {
                    good.push({ chapter, ...stats });
                }
            });

            return { mcqScore, needReview, good };
        }

                        <div>
                            <span class="text-sm font-bold text-indigo-300 tracking-wider bg-indigo-500/10 border border-indigo-500/20 px-3 py-1 rounded-full">${currentData.title}</span>
                            <h2 class="text-xs text-slate-400 mt-2 ml-1">หมวดหมู่: ${q.chapter}</h2>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-semibold text-slate-300">ทำแล้ว ${answeredCount}/50 ข้อ</span>
                            <div class="bg-slate-700 rounded-full h-2 w-32 mt-2 overflow-hidden shadow-inner">
                                <div class="bg-amber-500 h-2 rounded-full transition-all duration-300 shadow-[0_0_8px_rgba(245,158,11,0.6)]" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 md:p-10 flex-grow flex flex-col shadow-lg shadow-black/20 relative">
                        <div class="absolute top-4 right-6 text-xs text-slate-500 flex items-center">
                            <i data-lucide="cloud-lightning" class="w-3 h-3 mr-1 text-green-500"></i> บันทึกอัตโนมัติแล้ว
                        </div>
                        <div class="flex items-start mb-6 mt-4 md:mt-0">
                            <span class="text-4xl font-black text-slate-700 mr-4 mt-1 leading-none">${state.currentIdx + 1}.</span>
                            <h3 class="text-xl md:text-2xl font-medium leading-relaxed text-white">${q.question}</h3>
                        </div>
                        ${inputSectionHTML}
                    </div>

                    <div class="mt-6 flex justify-between items-center">
                        <button onclick="prevQuestion()" class="px-6 py-3 rounded-xl font-medium flex items-center transition-colors ${state.currentIdx === 0 ? 'invisible' : 'bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700'}">
                            <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> ก่อนหน้า
                        </button>
                        
                        ${state.currentIdx === 49 ? `
                            <button onclick="submitExam()" class="px-6 md:px-8 py-3 text-white rounded-xl font-bold transition-all flex items-center border shadow-lg ${submitBtnClass}">
                                <i data-lucide="${submitConfirmState ? 'alert-triangle' : 'check-circle'}" class="w-5 h-5 mr-2"></i> ${submitBtnText}
                            </button>
                        ` : `
                            <button onclick="nextQuestion()" class="px-6 py-3 rounded-xl font-medium flex items-center transition-colors bg-indigo-600 text-white hover:bg-indigo-500">
                                ถัดไป <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                            </button>
                        `}
                    </div>
                </div>

                <div class="w-full md:w-80 bg-slate-800 border-l border-slate-700 p-6 hidden md:block overflow-y-auto">
                    <div class="sticky top-0 bg-slate-800 pb-4 z-10 border-b border-slate-700 mb-4 flex justify-between items-center">
                        <h3 class="font-bold text-white">แผงนำทางข้อสอบ</h3>
                        <button onclick="goHome()" class="text-sm text-slate-400 hover:text-red-400 transition-colors">ออก</button>
                    </div>
                    
                    <p class="text-xs text-slate-500 mb-2">ส่วนที่ 1: เลือกตอบ (ข้อ 1-30)</p>
                    <div class="grid grid-cols-5 gap-2 mb-4">
                        ${navigatorHTML.match(/<button[\s\S]*?<\/button>/g).slice(0, 30).join('')}
                    </div>

                    <p class="text-xs text-slate-500 mb-2">ส่วนที่ 2: เติมคำ (ข้อ 31-40)</p>
                    <div class="grid grid-cols-5 gap-2 mb-4">
                        ${navigatorHTML.match(/<button[\s\S]*?<\/button>/g).slice(30, 40).join('')}
                    </div>

                    <p class="text-xs text-slate-500 mb-2">ส่วนที่ 3: วิธีทำ (ข้อ 41-50)</p>
                    <div class="grid grid-cols-5 gap-2">
                        ${navigatorHTML.match(/<button[\s\S]*?<\/button>/g).slice(40, 50).join('')}
                    </div>

                    <div class="mt-8 pt-4 border-t border-slate-700">
                        <div class="flex items-center text-xs text-slate-400 mb-2">
                            <div class="w-3 h-3 bg-slate-800 border border-slate-600 rounded mr-2"></div> ยังไม่ได้ทำ
                        </div>
                        <div class="flex items-center text-xs text-slate-400 mb-2">
                            <div class="w-3 h-3 bg-indigo-600 rounded mr-2"></div> ทำแล้ว
                        </div>
                        <div class="flex items-center text-xs text-slate-400">
                            <div class="w-3 h-3 bg-indigo-500/20 border-2 border-indigo-500 rounded mr-2"></div> ข้อปัจจุบัน
                        </div>
                    </div>
                </div>

                <div class="md:hidden bg-slate-800 border-t border-slate-700 p-4 sticky bottom-0 z-20">
                    <div class="flex overflow-x-auto gap-2 no-scrollbar pb-2">
                        ${navigatorHTML}
                    </div>
                </div>

            </div>
            `;
        }

        function getResultsHTML() {
            const record = state.viewingHistoryItem;
            const questionsData = examSets[record.setId].data;
            const analysis = record.analysisData;
            
            const isPass = analysis.mcqScore >= 15; // อิงเกณฑ์ครึ่งหนึ่งของ 30 ข้อ
            const message = isPass ? '🎉 ยินดีด้วย! คุณผ่านเกณฑ์ส่วนของช้อยส์' : '📚 ส่วนตัวเลือกยังไม่ผ่านเกณฑ์ ทบทวนเพิ่มนะครับ';
            const colorTheme = isPass ? 'indigo' : 'red';

            let needReviewHTML = analysis.needReview.length > 0 
                ? '<ul class="space-y-3">' + analysis.needReview.map(item => `
                    <li class="text-sm bg-slate-800 p-3 rounded-lg border border-red-500/20 text-red-300 flex justify-between items-center">
                        <span>${item.chapter}</span>
                        <span class="font-mono text-xs bg-red-500/20 px-2 py-1 rounded">ถูก ${item.correct}/${item.total}</span>
                    </li>`).join('') + '</ul>'
                : '<p class="text-sm text-green-400 italic">ยอดเยี่ยม! คุณตอบถูกในส่วนเลือกตอบทั้งหมด</p>';

            let goodHTML = analysis.good.length > 0
                ? '<ul class="space-y-3">' + analysis.good.map(item => `
                    <li class="text-sm bg-slate-800 p-3 rounded-lg border border-green-500/20 text-green-300 flex justify-between items-center">
                        <span>${item.chapter}</span>
                        <span class="font-mono text-xs bg-green-500/20 px-2 py-1 rounded">ถูก ${item.correct}/${item.total}</span>
                    </li>`).join('') + '</ul>'
                : '<p class="text-sm text-slate-500 italic">-</p>';

            let detailsHTML = '';
            questionsData.forEach((q, idx) => {
                const userAns = record.answers[idx];
                let isSkipped, isCorrect, borderClass, iconHTML, userAnswerText, answerLabel;

                if (q.type === 'mcq') {
                    isSkipped = userAns === null;
                    isCorrect = userAns === q.correctAnswer;
                    borderClass = isCorrect ? 'border-green-500/30 bg-green-500/10' : (isSkipped ? 'border-amber-500/30 bg-amber-500/10' : 'border-red-500/30 bg-red-500/10');
                    iconHTML = isCorrect ? '<i data-lucide="check-circle-2" class="w-6 h-6 text-green-400 shrink-0"></i>' : (isSkipped ? '<i data-lucide="minus-circle" class="w-6 h-6 text-amber-400 shrink-0"></i>' : '<i data-lucide="x-circle" class="w-6 h-6 text-red-400 shrink-0"></i>');
                    userAnswerText = isSkipped ? '<span class="text-amber-500 font-medium">ไม่ได้ตอบ</span>' : `<span class="${isCorrect ? 'text-green-400' : 'text-red-400'} line-through">${q.options[userAns]}</span>`;
                    answerLabel = q.options[q.correctAnswer];
                } else {
                    isSkipped = !userAns || userAns.trim() === '';
                    isCorrect = false; // สำหรับส่วนเขียนตอบ จะไม่ตีความว่าถูก/ผิด ให้เป็นสถานะรอตรวจ
                    borderClass = isSkipped ? 'border-amber-500/30 bg-amber-500/10' : 'border-indigo-500/30 bg-indigo-500/10';
                    iconHTML = isSkipped ? '<i data-lucide="minus-circle" class="w-6 h-6 text-amber-400 shrink-0"></i>' : '<i data-lucide="clock" class="w-6 h-6 text-indigo-400 shrink-0"></i>';
                    userAnswerText = isSkipped ? '<span class="text-amber-500 font-medium">ไม่ได้ตอบ</span>' : `<span class="text-indigo-300 break-words whitespace-pre-wrap">"${userAns}"</span>`;
                    answerLabel = q.correctAnswer;
                }

                const waitReviewBadge = (q.type !== 'mcq' && !isSkipped) ? '<span class="text-xs ml-2 bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded border border-indigo-500/30 font-medium">รอผู้สอนตรวจ</span>' : '';

                detailsHTML += `
                    <div class="p-5 rounded-xl border ${borderClass}">
                        <div class="flex items-start gap-3">
                            ${iconHTML}
                            <div class="flex-grow w-full overflow-hidden">
                                <h4 class="font-medium text-slate-200 leading-snug">ข้อ ${idx + 1}. ${q.question}</h4>
                                <div class="mt-3 space-y-2 text-sm">
                                    <div class="text-slate-400">คำตอบของคุณ: ${userAnswerText} ${waitReviewBadge}</div>
                                    <p class="text-green-400 font-medium">${q.type === 'mcq' ? 'เฉลย:' : 'แนวคำตอบ:'} ${answerLabel}</p>
                                    <div class="mt-3 p-3 bg-slate-900/50 rounded-lg border border-slate-700 text-slate-400 text-sm">
                                        <i data-lucide="info" class="w-4 h-4 inline-block mr-1 -mt-0.5 opacity-50"></i>
                                        ${q.explanation}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            return `
            <div class="min-h-screen py-10 px-4">
                <div class="max-w-4xl mx-auto space-y-6">
                    
                    <button onclick="goHome()" class="flex items-center text-slate-400 hover:text-indigo-400 transition-colors mb-6 font-medium">
                        <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> กลับหน้าหลัก
                    </button>

                    <div class="bg-slate-800 rounded-3xl border border-slate-700 p-8 text-center relative overflow-hidden shadow-lg">
                        <div class="absolute top-0 left-0 w-full h-2 bg-${colorTheme}-500"></div>
                        <h2 class="text-3xl font-bold mb-1 text-white">ผลการทดสอบ</h2>
                        <p class="text-slate-400 mb-6">${record.setName} • ส่งเมื่อ ${record.date}</p>
                        
                        <div class="inline-flex flex-col items-center justify-center w-40 h-40 rounded-full border-8 border-${colorTheme}-500/20 mb-3 relative shadow-inner">
                            <span class="text-5xl font-black text-${colorTheme}-400">${analysis.mcqScore}</span>
                            <span class="text-lg text-slate-500 font-medium border-t border-slate-700 w-16 pt-1 mt-1">30</span>
                        </div>
                        <p class="text-xl font-bold text-slate-300 mb-2">${message}</p>
                        <p class="text-sm text-indigo-400 bg-indigo-500/10 py-1.5 px-4 rounded-full inline-block border border-indigo-500/20">
                            * ส่วนอัตนัย (เติมคำ/วิธีทำ) อีก 20 ข้อ รอผู้สอนตรวจให้คะแนน
                        </p>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-red-500/10 rounded-2xl p-6 border border-red-500/20">
                            <div class="flex items-center mb-4 pb-4 border-b border-red-500/20">
                                <i data-lucide="target" class="w-6 h-6 text-red-400 mr-2"></i>
                                <h3 class="text-lg font-bold text-red-400">จุดที่ต้องเน้นทบทวน (จากช้อยส์)</h3>
                            </div>
                            ${needReviewHTML}
                        </div>

                        <div class="bg-green-500/10 rounded-2xl p-6 border border-green-500/20">
                            <div class="flex items-center mb-4 pb-4 border-b border-green-500/20">
                                <i data-lucide="award" class="w-6 h-6 text-green-400 mr-2"></i>
                                <h3 class="text-lg font-bold text-green-400">จุดที่ทำได้ดีเยี่ยม</h3>
                            </div>
                            ${goodHTML}
                        </div>
                    </div>

                    <div class="bg-slate-800 rounded-2xl border border-slate-700 p-6 md:p-8 mt-8 shadow-lg">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-700">
                            <h3 class="text-xl font-bold text-white flex items-center">
                                <i data-lucide="file-check-2" class="w-6 h-6 text-indigo-400 mr-2"></i>
                                เฉลยและแนวคำตอบทั้งหมด 50 ข้อ
                            </h3>
                        </div>
                        <div class="space-y-4">
                            ${detailsHTML}
                        </div>
                    </div>

                </div>
            </div>
            `;
        }

        // --- Start App ---
        render();

    </script>
</body>
</html>
