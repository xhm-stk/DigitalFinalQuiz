<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Systems Exam Portal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f8fafc;
        }
        /* ซ่อน Scrollbar สำหรับแผงนำทางข้อสอบ */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div id="app"></div>

    <script>
        // --- ข้อมูลฐานคำถาม (ดึงจากไฟล์ PDF และ Text ที่อัปโหลด) ---
        const baseQuestions = [
            { chapter: "ระบบตัวเลข", question: "สัญญาณดิจิทัลมีกี่สถานะ?", options: ["1 สถานะ", "2 สถานะ", "3 สถานะ", "ไม่จำกัด"], correctAnswer: 1, explanation: "สัญญาณดิจิทัลมี 2 สถานะ คือ 0 (Low) และ 1 (High)" },
            { chapter: "รหัสไบนารี่ (Week 11)", question: "รหัส BCD-8421 ของเลข 7 คือข้อใด?", options: ["0110", "1000", "0111", "1001"], correctAnswer: 2, explanation: "เลข 7 ในระบบฐานสิบ แปลงเป็นเลขฐานสองแบบ BCD-8421 ใช้ 4 บิต คือ 0111" },
            { chapter: "รหัสไบนารี่ (Week 11)", question: "เลขฐานสิบ 47 เมื่อแปลงเป็น BCD-8421 ได้ผลลัพธ์คือข้อใด?", options: ["0100 0111", "0100 1000", "101111", "0111 0100"], correctAnswer: 0, explanation: "4 แปลงเป็น 0100 และ 7 แปลงเป็น 0111 นำมาต่อกัน" },
            { chapter: "รหัสไบนารี่ (Week 11)", question: "รหัส Excess-3 ของเลข 5 คือข้อใด?", options: ["0101", "1000", "0111", "1010"], correctAnswer: 1, explanation: "Excess-3 คือการนำเลขฐานสิบมาบวก 3 (5+3=8) แล้วแปลงเป็นฐานสอง 4 บิต (1000)" },
            { chapter: "คณิตศาสตร์ลอจิก (Week 11)", question: "การแปลงเลขทศนิยมฐานสิบ 0.625 เป็นเลขฐานสอง มีค่าตรงกับข้อใด?", options: ["0.101", "0.110", "0.011", "0.111"], correctAnswer: 0, explanation: "0.625 × 2 = 1.250 (1), 0.250 × 2 = 0.500 (0), 0.500 × 2 = 1.000 (1) -> 0.101" },
            { chapter: "ลอจิกเกต (Week 12)", question: "ตัวแปรลอจิก (Logic Variable) มีลักษณะตามข้อใด?", options: ["มีสถานะต่อเนื่อง", "อยู่พร้อมกันได้ 2 สถานะ", "มีได้เพียง 2 สถานะ และเป็นพร้อมกันไม่ได้", "มีค่าเป็น 1 เสมอ"], correctAnswer: 2, explanation: "เป็น Bi-State Variable (เปิด-ปิด, 0-1) เป็นพร้อมกันไม่ได้" },
            { chapter: "วงจรคอมบิเนชั่นฯ (Week 13)", question: "ข้อใดกล่าวถูกต้องเกี่ยวกับวงจรคอมบิเนชั่น?", options: ["มีหน่วยความจำ", "ขึ้นอยู่กับอินพุตปัจจุบันและสภาวะก่อนหน้า", "ต้องมี Clock", "เอาต์พุตขึ้นอยู่กับอินพุตปัจจุบันเท่านั้น"], correctAnswer: 3, explanation: "วงจรคอมบิเนชั่นไม่มีการป้อนกลับและไม่มีหน่วยความจำ" },
            { chapter: "วงจรคอมบิเนชั่นฯ (Week 13)", question: "การต่อ LED 7-segment แบบมัลติเพล็กซ์ มีลักษณะอย่างไร?", options: ["1 วงจรถอดรหัส ต่อ 1 หลัก", "ต่อขา a-g เข้าด้วยกัน ใช้ขา Common สลับการทำงาน", "ไม่ใช้ตัวต้านทาน", "ไฟติดพร้อมกันทั้งหมดเสมอ"], correctAnswer: 1, explanation: "แชร์พอร์ต a-g และใช้ขา Common กวาดสลับติดทีละหลักอย่างรวดเร็ว" },
            { chapter: "วงจรฟลิปฟลอป (Week 16)", question: "ฟลิปฟลอป ทำหน้าที่หลักอะไร?", options: ["แปลงอนาล็อกเป็นดิจิทัล", "กรองความถี่", "หน่วยความจำ 1 บิต", "เพิ่มแรงดัน"], correctAnswer: 2, explanation: "เป็นอุปกรณ์ Bistable ใช้เก็บสถานะ 0 หรือ 1 เสมือนหน่วยความจำ 1 บิต" },
            { chapter: "วงจรฟลิปฟลอป (Week 16)", question: "ใน JK Flip-Flop หาก J=1, K=1 เมื่อมี Clock เอาต์พุตจะเป็นอย่างไร?", options: ["เป็น 1 เสมอ", "เป็น 0 เสมอ", "คงค่าเดิม", "สลับสถานะจากเดิม (Toggle)"], correctAnswer: 3, explanation: "สภาวะ Toggle จะกลับสถานะจาก 0 เป็น 1 หรือ 1 เป็น 0" },
            { chapter: "วงจรนับ (Week 16)", question: "วงจรนับ (Counter Circuit) ถูกต่อยอดจากอุปกรณ์ใด?", options: ["Encoder", "Multiplexer", "Decoder", "Flip-Flop"], correctAnswer: 3, explanation: "วงจรนับเป็น Sequential Circuit ที่ต้องใช้ Flip-Flop มาต่อร่วมกัน" },
            { chapter: "วงจรเลื่อนข้อมูล (Week 17)", question: "วงจรเลื่อนข้อมูลแบบ PIPO คืออะไร?", options: ["เข้าทีละบิต ออกทีละบิต", "เข้าทีละบิต ออกพร้อมกัน", "เข้าพร้อมกัน ออกทีละบิต", "เข้าพร้อมกัน ออกพร้อมกัน"], correctAnswer: 3, explanation: "PIPO = Parallel In - Parallel Out" },
            { chapter: "วงจร Sequential (Week 17)", question: "ความแตกต่างสำคัญที่ทำให้ วงจร Sequential ต่างจาก วงจร Combinational?", options: ["ทำงานแบบ Asynchronous", "เอาต์พุตขึ้นอยู่กับอินพุตปัจจุบันและเอาต์พุตเดิม", "ใช้แค่ Logic Gate พื้นฐาน", "เอาต์พุตเร็วกว่า"], correctAnswer: 1, explanation: "Sequential มีหน่วยความจำ (Feedback) บันทึกสภาวะก่อนหน้า" },
            { chapter: "วงจรนับ (Week 16)", question: "วงจรนับแบบใดที่สัญญาณนาฬิกาเข้าที่ฟลิปฟลอปตัวแรกเท่านั้น?", options: ["Synchronous Counter", "Asynchronous (Ripple) Counter", "Ring Counter", "Johnson Counter"], correctAnswer: 1, explanation: "Ripple Counter จะส่งผ่านสัญญาณนาฬิกาต่อๆ กันไป (ไม่ได้เข้าทุกตัวพร้อมกัน)" },
            { chapter: "รหัสต่าง ๆ (Week 11)", question: "ข้อใดเป็นคุณสมบัติเด่นของ Gray Code?", options: ["ใช้บิตน้อยที่สุด", "รหัสบิตถัดไปเปลี่ยนแปลงเพียงครั้งละ 1 บิต", "คำนวณทางคณิตศาสตร์ได้ง่าย", "เป็นรหัสที่มีการถ่วงน้ำหนัก"], correctAnswer: 1, explanation: "คุณสมบัติสำคัญของ Gray Code คือเมื่อค่าเปลี่ยน 1 สเตป บิตจะเปลี่ยนสถานะเพียงบิตเดียวเท่านั้น เพื่อลดข้อผิดพลาด" }
        ];

        // --- สร้างชุดข้อสอบ 50 ข้อ ---
        function generateExamSet(setName, prefixId) {
            let exam = [];
            // ใส่ข้อสอบจริงลงไปก่อน
            const shuffledBase = [...baseQuestions].sort(() => Math.random() - 0.5);
            
            // วนลูปสร้างข้อสอบให้ครบ 50 ข้อต่อชุด
            for (let i = 0; i < 50; i++) {
                if (i < shuffledBase.length) {
                    exam.push({ id: `${prefixId}-${i+1}`, ...shuffledBase[i] });
                } else {
                    // สร้างข้อสอบจำลองแบบสุ่มให้ครบจำนวน เพื่อการทดสอบระบบ 50 ข้อ
                    const baseRef = shuffledBase[i % shuffledBase.length];
                    exam.push({
                        id: `${prefixId}-${i+1}`,
                        chapter: baseRef.chapter,
                        question: `[ข้อสอบเสมือน ${i+1}] ${baseRef.question}`,
                        options: baseRef.options,
                        correctAnswer: baseRef.correctAnswer,
                        explanation: `(เนื้อหาอ้างอิง) ${baseRef.explanation}`
                    });
                }
            }
            return exam;
        }

        const examSets = {
            'A': { title: 'ชุดที่ 1 (SET A)', data: generateExamSet('ชุดที่ 1 (SET A)', 'A') },
            'B': { title: 'ชุดที่ 2 (SET B)', data: generateExamSet('ชุดที่ 2 (SET B)', 'B') },
            'C': { title: 'ชุดที่ 3 (SET C)', data: generateExamSet('ชุดที่ 3 (SET C)', 'C') }
        };

        // --- State ของแอปพลิเคชัน ---
        let state = {
            stage: 'home', // 'home', 'quiz', 'results'
            currentSetId: null,
            currentIdx: 0,
            answers: [], // เก็บคำตอบของ currentSet
            history: JSON.parse(localStorage.getItem('digitalExamHistory')) || [],
            viewingHistoryItem: null // สำหรับดูรายละเอียดประวัติ
        };

        // --- Core Functions ---
        function saveHistory() {
            localStorage.setItem('digitalExamHistory', JSON.stringify(state.history));
        }

        function render() {
            const app = document.getElementById('app');
            window.scrollTo(0, 0); // เลื่อนขึ้นบนสุดเมื่อเปลี่ยนหน้า
            
            if (state.stage === 'home') {
                app.innerHTML = getHomeHTML();
            } else if (state.stage === 'quiz') {
                app.innerHTML = getQuizHTML();
            } else if (state.stage === 'results') {
                app.innerHTML = getResultsHTML();
            }

            lucide.createIcons();
        }

        // --- Controllers ---
        window.startExam = (setId) => {
            state.stage = 'quiz';
            state.currentSetId = setId;
            state.currentIdx = 0;
            state.answers = Array(50).fill(null);
            render();
        };

        window.jumpToQuestion = (idx) => {
            state.currentIdx = idx;
            render();
        };

        window.selectOption = (optionIndex) => {
            state.answers[state.currentIdx] = optionIndex;
            render();
        };

        window.nextQuestion = () => {
            if (state.currentIdx < 49) {
                state.currentIdx++;
                render();
            }
        };

        window.prevQuestion = () => {
            if (state.currentIdx > 0) {
                state.currentIdx--;
                render();
            }
        };

        window.submitExam = () => {
            if(confirm("คุณต้องการส่งคำตอบและดูผลคะแนนใช่หรือไม่?")) {
                const analysis = calculateAnalysis(state.answers, examSets[state.currentSetId].data);
                
                // บันทึกประวัติ
                const historyRecord = {
                    id: Date.now(),
                    setId: state.currentSetId,
                    setName: examSets[state.currentSetId].title,
                    date: new Date().toLocaleString('th-TH'),
                    score: analysis.score,
                    total: 50,
                    answers: [...state.answers],
                    analysisData: analysis
                };
                
                state.history.unshift(historyRecord); // เพิ่มลงประวัติล่าสุด
                saveHistory();

                state.viewingHistoryItem = historyRecord;
                state.stage = 'results';
                render();
            }
        };

        window.goHome = () => {
            state.stage = 'home';
            state.currentSetId = null;
            state.viewingHistoryItem = null;
            render();
        };

        window.viewHistoryDetail = (historyId) => {
            const record = state.history.find(h => h.id === historyId);
            if (record) {
                state.viewingHistoryItem = record;
                state.stage = 'results';
                render();
            }
        };

        window.clearHistory = () => {
            if(confirm("คุณแน่ใจหรือไม่ว่าต้องการลบประวัติการสอบทั้งหมด?")) {
                state.history = [];
                saveHistory();
                render();
            }
        };

        // --- วิเคราะห์ผล ---
        function calculateAnalysis(userAnswers, questionsData) {
            let score = 0;
            const chapters = {};

            userAnswers.forEach((ans, idx) => {
                const q = questionsData[idx];
                if (!chapters[q.chapter]) {
                    chapters[q.chapter] = { total: 0, correct: 0 };
                }
                chapters[q.chapter].total += 1;
                
                if (ans === q.correctAnswer) {
                    score += 1;
                    chapters[q.chapter].correct += 1;
                }
            });

            const needReview = [];
            const good = [];

            Object.entries(chapters).forEach(([chapter, stats]) => {
                const percentage = stats.correct / stats.total;
                if (percentage < 0.7) { // เกณฑ์ 70%
                    needReview.push({ chapter, ...stats });
                } else {
                    good.push({ chapter, ...stats });
                }
            });

            return { score, needReview, good };
        }

        // --- Views ---
        function getHomeHTML() {
            let historyHTML = '';
            if (state.history.length === 0) {
                historyHTML = `
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200 border-dashed">
                        <i data-lucide="history" class="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                        <p class="text-slate-500">ยังไม่มีประวัติการทำข้อสอบ</p>
                    </div>`;
            } else {
                historyHTML = '<div class="space-y-4">';
                state.history.forEach(h => {
                    const passClass = h.score >= 25 ? 'text-green-600 bg-green-50 border-green-200' : 'text-red-600 bg-red-50 border-red-200';
                    historyHTML += `
                        <div class="flex items-center justify-between p-4 bg-white rounded-xl border border-slate-200 shadow-sm hover:shadow-md transition-shadow">
                            <div>
                                <h4 class="font-semibold text-slate-800">${h.setName}</h4>
                                <div class="flex items-center text-sm text-slate-500 mt-1">
                                    <i data-lucide="calendar" class="w-4 h-4 mr-1"></i> ${h.date}
                                </div>
                            </div>
                            <div class="flex items-center space-x-4">
                                <div class="${passClass} px-4 py-2 rounded-lg border font-bold text-lg">
                                    ${h.score} / 50
                                </div>
                                <button onclick="viewHistoryDetail(${h.id})" class="p-2 text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors" title="ดูรายละเอียด">
                                    <i data-lucide="chevron-right" class="w-6 h-6"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
                historyHTML += '</div>';
            }

            return `
            <div class="min-h-screen pb-12">
                <!-- Header -->
                <div class="bg-indigo-700 text-white pt-16 pb-20 px-6 rounded-b-[3rem] shadow-lg">
                    <div class="max-w-4xl mx-auto text-center">
                        <i data-lucide="brain-circuit" class="w-16 h-16 mx-auto mb-4 text-indigo-200"></i>
                        <h1 class="text-4xl md:text-5xl font-bold mb-4 tracking-tight">Digital Systems Exam Portal</h1>
                        <p class="text-indigo-200 text-lg md:text-xl max-w-2xl mx-auto">ระบบจำลองการสอบแบบ 50 ข้อ พร้อมวิเคราะห์จุดแข็ง-จุดอ่อนรายบทเรียน เพื่อเตรียมความพร้อมก่อนลงสนามจริง</p>
                    </div>
                </div>

                <div class="max-w-4xl mx-auto px-4 -mt-10 space-y-12">
                    
                    <!-- เลือกชุดข้อสอบ -->
                    <section>
                        <div class="flex items-center mb-6">
                            <i data-lucide="play-circle" class="w-6 h-6 text-indigo-600 mr-2"></i>
                            <h2 class="text-2xl font-bold text-slate-800">เลือกชุดข้อสอบ</h2>
                        </div>
                        <div class="grid md:grid-cols-3 gap-6">
                            ${Object.keys(examSets).map(key => `
                                <div class="bg-white rounded-2xl p-6 shadow-lg shadow-slate-200/50 border border-slate-100 hover:border-indigo-300 hover:shadow-indigo-100 transition-all group">
                                    <div class="w-12 h-12 bg-indigo-100 rounded-full flex items-center justify-center text-indigo-600 font-bold text-xl mb-4 group-hover:scale-110 transition-transform">
                                        ${key}
                                    </div>
                                    <h3 class="text-xl font-bold text-slate-800 mb-2">${examSets[key].title}</h3>
                                    <p class="text-slate-500 mb-6 flex items-center"><i data-lucide="file-text" class="w-4 h-4 mr-2"></i> จำนวน 50 ข้อ</p>
                                    <button onclick="startExam('${key}')" class="w-full py-3 bg-indigo-50 text-indigo-700 font-semibold rounded-xl group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                                        เริ่มทำข้อสอบ
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    </section>

                    <!-- ประวัติการสอบ -->
                    <section>
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center">
                                <i data-lucide="history" class="w-6 h-6 text-indigo-600 mr-2"></i>
                                <h2 class="text-2xl font-bold text-slate-800">ประวัติการสอบของคุณ</h2>
                            </div>
                            ${state.history.length > 0 ? `
                                <button onclick="clearHistory()" class="text-sm text-red-500 hover:text-red-700 flex items-center">
                                    <i data-lucide="trash-2" class="w-4 h-4 mr-1"></i> ล้างประวัติ
                                </button>
                            ` : ''}
                        </div>
                        ${historyHTML}
                    </section>

                </div>
            </div>
            `;
        }

        function getQuizHTML() {
            const currentData = examSets[state.currentSetId];
            const q = currentData.data[state.currentIdx];
            const answeredCount = state.answers.filter(a => a !== null).length;
            const progressPercent = (answeredCount / 50) * 100;

            // สร้างตัวเลือก
            let optionsHTML = '';
            q.options.forEach((opt, i) => {
                const isSelected = state.answers[state.currentIdx] === i;
                const btnClass = isSelected 
                    ? 'border-indigo-600 bg-indigo-50 text-indigo-900 shadow-sm ring-1 ring-indigo-600' 
                    : 'border-slate-200 hover:border-indigo-300 hover:bg-slate-50 text-slate-700';
                const circleClass = isSelected ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300 bg-white';
                
                optionsHTML += `
                    <button onclick="selectOption(${i})" class="w-full text-left p-4 rounded-xl border-2 transition-all duration-200 flex items-center ${btnClass}">
                        <div class="w-6 h-6 rounded-full border-2 flex items-center justify-center mr-4 shrink-0 transition-colors ${circleClass}">
                            ${isSelected ? '<div class="w-2 h-2 rounded-full bg-white"></div>' : ''}
                        </div>
                        <span class="text-md leading-relaxed">${opt}</span>
                    </button>
                `;
            });

            // สร้างแผงนำทาง 50 ข้อ
            let navigatorHTML = '';
            for (let i = 0; i < 50; i++) {
                const isDone = state.answers[i] !== null;
                const isCurrent = state.currentIdx === i;
                let btnStyle = 'bg-white border-slate-200 text-slate-500 hover:bg-slate-50';
                if (isCurrent) btnStyle = 'ring-2 ring-indigo-600 bg-indigo-50 border-indigo-200 text-indigo-800 font-bold';
                else if (isDone) btnStyle = 'bg-indigo-600 border-indigo-600 text-white shadow-sm';

                navigatorHTML += `
                    <button onclick="jumpToQuestion(${i})" class="w-10 h-10 flex items-center justify-center rounded-lg border text-sm transition-all ${btnStyle}">
                        ${i + 1}
                    </button>
                `;
            }

            return `
            <div class="min-h-screen flex flex-col md:flex-row">
                
                <!-- Main Quiz Area -->
                <div class="flex-grow flex flex-col py-6 px-4 md:px-8 max-w-4xl w-full mx-auto">
                    <!-- Header -->
                    <div class="mb-6 flex items-center justify-between bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                        <div>
                            <span class="text-sm font-bold text-indigo-600 tracking-wider bg-indigo-50 px-3 py-1 rounded-full">${currentData.title}</span>
                            <h2 class="text-xs text-slate-500 mt-2 ml-1">หมวดหมู่: ${q.chapter}</h2>
                        </div>
                        <div class="text-right">
                            <span class="text-sm font-semibold text-slate-700">ทำแล้ว ${answeredCount}/50 ข้อ</span>
                            <div class="bg-slate-100 rounded-full h-2 w-32 mt-2 overflow-hidden">
                                <div class="bg-indigo-500 h-2 rounded-full transition-all duration-300" style="width: ${progressPercent}%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Question Card -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-10 flex-grow flex flex-col">
                        <div class="flex items-start mb-8">
                            <span class="text-4xl font-black text-indigo-200 mr-4 mt-1 leading-none">${state.currentIdx + 1}.</span>
                            <h3 class="text-xl md:text-2xl font-medium leading-relaxed text-slate-800">${q.question}</h3>
                        </div>
                        <div class="space-y-3 mt-auto">
                            ${optionsHTML}
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="mt-6 flex justify-between items-center">
                        <button onclick="prevQuestion()" class="px-6 py-3 rounded-xl font-medium flex items-center transition-colors ${state.currentIdx === 0 ? 'invisible' : 'bg-white text-slate-700 shadow-sm border border-slate-200 hover:bg-slate-50'}">
                            <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> ก่อนหน้า
                        </button>
                        
                        ${state.currentIdx === 49 ? `
                            <button onclick="submitExam()" class="px-8 py-3 bg-green-600 text-white rounded-xl font-bold shadow-lg hover:bg-green-700 hover:shadow-green-500/30 transition-all flex items-center">
                                <i data-lucide="check-circle" class="w-5 h-5 mr-2"></i> ส่งคำตอบทั้งหมด
                            </button>
                        ` : `
                            <button onclick="nextQuestion()" class="px-6 py-3 rounded-xl font-medium flex items-center transition-colors bg-indigo-600 text-white shadow-md hover:bg-indigo-700">
                                ถัดไป <i data-lucide="arrow-right" class="w-5 h-5 ml-2"></i>
                            </button>
                        `}
                    </div>
                </div>

                <!-- Right Sidebar (Navigator) -->
                <div class="w-full md:w-80 bg-white border-l border-slate-200 p-6 shadow-[-10px_0_15px_-3px_rgba(0,0,0,0.02)] hidden md:block overflow-y-auto">
                    <div class="sticky top-0 bg-white pb-4 z-10 border-b border-slate-100 mb-4 flex justify-between items-center">
                        <h3 class="font-bold text-slate-800">แผงนำทางข้อสอบ</h3>
                        <button onclick="goHome()" class="text-sm text-slate-400 hover:text-red-500 transition-colors">ออกจากการสอบ</button>
                    </div>
                    <div class="grid grid-cols-5 gap-2">
                        ${navigatorHTML}
                    </div>
                    <div class="mt-8 pt-4 border-t border-slate-100">
                        <div class="flex items-center text-xs text-slate-500 mb-2">
                            <div class="w-3 h-3 bg-white border border-slate-300 rounded mr-2"></div> ยังไม่ได้ทำ
                        </div>
                        <div class="flex items-center text-xs text-slate-500 mb-2">
                            <div class="w-3 h-3 bg-indigo-600 rounded mr-2"></div> ทำแล้ว
                        </div>
                        <div class="flex items-center text-xs text-slate-500">
                            <div class="w-3 h-3 bg-indigo-50 border-2 border-indigo-600 rounded mr-2"></div> ข้อปัจจุบัน
                        </div>
                    </div>
                </div>

                <!-- Mobile Navigator Bottom Sheet (Simplified) -->
                <div class="md:hidden bg-white border-t border-slate-200 p-4 sticky bottom-0">
                    <div class="flex overflow-x-auto gap-2 no-scrollbar pb-2">
                        ${navigatorHTML}
                    </div>
                </div>

            </div>
            `;
        }

        function getResultsHTML() {
            const record = state.viewingHistoryItem;
            const questionsData = examSets[record.setId].data;
            const analysis = record.analysisData;
            
            const isPass = analysis.score >= 25; // ผ่านที่ 50%
            const message = isPass ? '🎉 ยินดีด้วย! คุณผ่านเกณฑ์การทดสอบ' : '📚 ต้องพยายามอีกนิด กลับไปทบทวนเนื้อหานะครับ';
            const colorTheme = isPass ? 'indigo' : 'red';

            // เรนเดอร์คำแนะนำ
            let needReviewHTML = analysis.needReview.length > 0 
                ? '<ul class="space-y-3">' + analysis.needReview.map(item => `
                    <li class="text-sm bg-white p-3 rounded-lg border border-red-100 text-red-900 shadow-sm flex justify-between items-center">
                        <span>${item.chapter}</span>
                        <span class="font-mono text-xs bg-red-100 px-2 py-1 rounded">ถูก ${item.correct}/${item.total}</span>
                    </li>`).join('') + '</ul>'
                : '<p class="text-sm text-green-600 italic">ยอดเยี่ยม! คุณผ่านเกณฑ์ทุกหัวข้อ</p>';

            let goodHTML = analysis.good.length > 0
                ? '<ul class="space-y-3">' + analysis.good.map(item => `
                    <li class="text-sm bg-white p-3 rounded-lg border border-green-100 text-green-900 shadow-sm flex justify-between items-center">
                        <span>${item.chapter}</span>
                        <span class="font-mono text-xs bg-green-100 px-2 py-1 rounded">ถูก ${item.correct}/${item.total}</span>
                    </li>`).join('') + '</ul>'
                : '<p class="text-sm text-slate-500 italic">-</p>';

            // เรนเดอร์เฉลยทั้ง 50 ข้อ
            let detailsHTML = '';
            questionsData.forEach((q, idx) => {
                const userAns = record.answers[idx];
                const isCorrect = userAns === q.correctAnswer;
                const isSkipped = userAns === null;
                
                const borderClass = isCorrect ? 'border-green-200 bg-green-50/30' : (isSkipped ? 'border-amber-200 bg-amber-50/30' : 'border-red-200 bg-red-50/30');
                const iconHTML = isCorrect 
                    ? '<i data-lucide="check-circle-2" class="w-6 h-6 text-green-500 shrink-0"></i>' 
                    : (isSkipped ? '<i data-lucide="minus-circle" class="w-6 h-6 text-amber-500 shrink-0"></i>' : '<i data-lucide="x-circle" class="w-6 h-6 text-red-500 shrink-0"></i>');

                let userAnswerText = isSkipped ? '<span class="text-amber-600 font-medium">ไม่ได้ตอบ</span>' 
                                               : `<span class="${isCorrect ? 'text-green-600' : 'text-red-600'} line-through">${q.options[userAns]}</span>`;

                detailsHTML += `
                    <div class="p-5 rounded-xl border ${borderClass}">
                        <div class="flex items-start gap-3">
                            ${iconHTML}
                            <div class="flex-grow">
                                <h4 class="font-medium text-slate-800 leading-snug">ข้อ ${idx + 1}. ${q.question}</h4>
                                <div class="mt-3 space-y-1.5 text-sm">
                                    ${!isCorrect ? `<p class="text-slate-600">คำตอบของคุณ: ${userAnswerText}</p>` : ''}
                                    <p class="text-green-700 font-medium">เฉลย: ${q.options[q.correctAnswer]}</p>
                                    <div class="mt-3 p-3 bg-white/60 rounded-lg border border-slate-200/60 text-slate-600 text-sm">
                                        <i data-lucide="info" class="w-4 h-4 inline-block mr-1 -mt-0.5 opacity-50"></i>
                                        ${q.explanation}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });

            return `
            <div class="min-h-screen py-10 px-4 bg-slate-50">
                <div class="max-w-4xl mx-auto space-y-6">
                    
                    <!-- Top nav -->
                    <button onclick="goHome()" class="flex items-center text-slate-500 hover:text-indigo-600 transition-colors mb-6 font-medium">
                        <i data-lucide="arrow-left" class="w-5 h-5 mr-2"></i> กลับหน้าหลัก
                    </button>

                    <!-- Score Header -->
                    <div class="bg-white rounded-3xl shadow-sm border border-slate-100 p-8 text-center relative overflow-hidden">
                        <div class="absolute top-0 left-0 w-full h-2 bg-${colorTheme}-500"></div>
                        <h2 class="text-3xl font-bold mb-1 text-slate-800">ผลการทดสอบ</h2>
                        <p class="text-slate-500 mb-6">${record.setName} • ส่งเมื่อ ${record.date}</p>
                        
                        <div class="inline-flex flex-col items-center justify-center w-40 h-40 rounded-full border-8 border-${colorTheme}-100 mb-6 relative">
                            <span class="text-5xl font-black text-${colorTheme}-600">${analysis.score}</span>
                            <span class="text-lg text-slate-400 font-medium border-t border-slate-200 w-16 pt-1 mt-1">50</span>
                        </div>
                        <p class="text-xl font-bold text-slate-700">${message}</p>
                    </div>

                    <!-- Analysis Cards -->
                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-red-50 rounded-2xl p-6 border border-red-100">
                            <div class="flex items-center mb-4 pb-4 border-b border-red-200/50">
                                <i data-lucide="target" class="w-6 h-6 text-red-600 mr-2"></i>
                                <h3 class="text-lg font-bold text-red-800">จุดที่ต้องเน้นทบทวน</h3>
                            </div>
                            ${needReviewHTML}
                        </div>

                        <div class="bg-green-50 rounded-2xl p-6 border border-green-100">
                            <div class="flex items-center mb-4 pb-4 border-b border-green-200/50">
                                <i data-lucide="award" class="w-6 h-6 text-green-600 mr-2"></i>
                                <h3 class="text-lg font-bold text-green-800">จุดที่ทำได้ดีเยี่ยม</h3>
                            </div>
                            ${goodHTML}
                        </div>
                    </div>

                    <!-- All Details -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 md:p-8 mt-8">
                        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
                            <h3 class="text-xl font-bold text-slate-800 flex items-center">
                                <i data-lucide="file-check-2" class="w-6 h-6 text-indigo-600 mr-2"></i>
                                เฉลยละเอียดทั้งหมด 50 ข้อ
                            </h3>
                        </div>
                        <div class="space-y-4">
                            ${detailsHTML}
                        </div>
                    </div>

                </div>
            </div>
            `;
        }

        // --- Start App ---
        render();

    </script>
</body>
</html>
